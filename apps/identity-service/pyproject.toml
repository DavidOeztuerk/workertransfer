[project]
name = "worker-identity-service"
version = "0.1.0"
description = "WorkerTransfer identity service"
requires-python = ">=3.14"
dependencies = [
  "uvicorn[standard]>=0.40.0,<1.0.0",
  "worker-core",
  "worker-platform",
]

[project.scripts]
worker-identity = "identity_service.main:run"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "identity_service"

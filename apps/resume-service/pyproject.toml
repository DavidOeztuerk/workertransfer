[project]
name = "resume-service"
version = "0.1.0"
description = "Resume Service service"
requires-python = ">=3.14"
dependencies = [
    # Bewusst knapp: nur was ein frischer Service wirklich braucht. Die frühere
    # Liste deklarierte zwanzig Pakete, darunter worker-cqrs (gelöscht,
    # ADR-0005) und worker-exceptions (gelöscht, ADR-0014) — `uv sync` scheiterte
    # daran, und jeder generierte Service zog unbenutzte Abhängigkeiten in sein
    # Image. Was zusätzlich gebraucht wird, deklariert der Service selbst;
    # tests/test_workspace_dependencies.py erzwingt das ohnehin.
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.40.0,<1.0.0",
    "sqlalchemy[asyncio]>=2.0.0,<3.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "alembic>=1.13.0,<2.0.0",
    "psycopg[binary]>=3.1.0,<4.0.0",
    "pydantic>=2.8.0,<3.0.0",
    "pydantic-settings>=2.4.0,<3.0.0",
    "worker-core",
    "worker-platform",
    "worker-database",
    "worker-outbox",
    "worker-auth",
    "worker-tenancy",
    "worker-shared",
    "worker-contracts",
    "httpx>=0.27.0,<1.0.0",
]

[project.scripts]
resume_service = "resume_service.main:run"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "resume_service"

[tool.uv.sources]
worker-core = { workspace = true }
worker-platform = { workspace = true }
worker-database = { workspace = true }
worker-outbox = { workspace = true }
worker-auth = { workspace = true }
worker-tenancy = { workspace = true }
worker-shared = { workspace = true }
worker-contracts = { workspace = true }

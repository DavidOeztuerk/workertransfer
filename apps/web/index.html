<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="WorkerTransfer – consent-first talent mobility and career workflows."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>WorkerTransfer</title>
    <!--
      Laufzeitkonfiguration. Bewusst KEIN type="module": ein klassisches Skript
      läuft sofort und damit garantiert vor dem Bündel darunter, das als Modul
      ohnehin verzögert ausgeführt wird. src/env.ts liest die Werte beim Import,
      und dieser Import darf nicht der Erste sein.

      Sie wird nicht gebündelt (sie liegt in public/), bleibt also eine eigene
      Datei — und genau das erlaubt es dem Helm-Chart, sie im Container zu
      ersetzen, statt für jede Umgebung ein neues Image zu bauen.
    -->
    <script src="/config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

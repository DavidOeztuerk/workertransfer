# Der ganze Stapel: Datenbank, Mailfaenger, elf Dienste, das Gateway und die
# Oberflaeche.
#
#   docker compose up --build     # alles starten
#   docker compose down           # anhalten, Daten behalten
#   docker compose down -v        # anhalten und Datenbanken wegwerfen
#
# Es gibt kein Begleitskript. `up` wandert jedes Schema und startet den Dienst;
# ein frischer Klon braucht sonst nichts.
#
# ---------------------------------------------------------------------------
# DAS BAUEN BRAUCHT EIN GEHEIMNIS.
#
# Girder liegt in GitHub Packages, und das verlangt eine Anmeldung. Der Bau
# bindet dafuer die NuGet-Konfiguration des Nutzers als BuildKit-Geheimnis ein
# (`secrets:` unten) — sie wird nie eine Schicht des Bildes, und der Zugriff
# steht nicht im Verlauf.
#
# Wer sie nicht hat: `dotnet nuget add source ... --username <du> --password
# <token> --store-password-in-clear-text` legt sie an.
# ---------------------------------------------------------------------------
# EINEN DIENST HINZUFUEGEN — drei Schritte, kein neues Dockerfile:
#   1. scripts/initdb/01-create-service-databases.sql: seine Datenbank.
#      ACHTUNG: initdb laeuft NUR bei leerem Datentraeger. Auf einem Stapel,
#      der schon lief, passiert nichts, und der neue Dienst dreht sich in
#      "database ... does not exist" im Kreis. Entweder einmal
#      `docker compose down -v && docker compose up`, oder ohne Datenverlust:
#        docker compose exec postgres psql -U worker -d postgres \
#          -c 'CREATE DATABASE <name> OWNER worker;'
#   2. docker/dotnet-service.Dockerfile: seinen Einstiegspunkt in die Liste.
#   3. Einen Block unten kopieren und drei Dinge aendern: den Namen,
#      SERVICE_DIR und den Hafen. Und die Route in
#      src/gateway/WorkerTransfer.Gateway/ocelot.json.
# ---------------------------------------------------------------------------

x-dienst: &dienst
  restart: unless-stopped
  build:
    context: .
    dockerfile: docker/dotnet-service.Dockerfile
    secrets:
      - nuget_config
  # EIN Bild fuer alle elf. Wer der Behaelter ist, sagt SERVICE_DIR aus der
  # Umgebung — nicht ein Bauargument (ADR-0028).
  image: workertransfer-dotnet:local
  depends_on:
    postgres:
      condition: service_healthy
  # EINE Probe fuer alle zwoelf, und sie fragt das, was zaehlt: /health/live,
  # dieselbe Adresse, die auch Kubernetes abfragt.
  #
  # Der Hafen kommt aus ASPNETCORE_URLS, damit er nicht ein zweites Mal
  # dasteht — eine zweite Liste von Haefen geht beim ersten neuen Dienst
  # auseinander. `$$` schuetzt die Ersetzung vor Compose, `##*:` schneidet in
  # dash alles bis zum letzten Doppelpunkt ab.
  #
  # Hier stand `dotnet --version`. Das kann auf einem LAUFZEITBILD nie
  # gelingen (kein SDK, Abbruchcode 155) — jeder Dienst meldete `unhealthy`,
  # waehrend er tadellos antwortete. Eine Probe, die immer rot ist, ist
  # schlimmer als keine: nach der zweiten Woche liest sie niemand mehr.
  healthcheck:
    test:
      - CMD-SHELL
      - curl -fsS "http://127.0.0.1:$${ASPNETCORE_URLS##*:}/health/live" > /dev/null || exit 1
    interval: 10s
    timeout: 5s
    retries: 12
    # Wandern kostet Zeit, und der erste Start wartet zusaetzlich auf eine
    # erreichbare Datenbank.
    start_period: 60s

# KEIN GEHEIMNIS HAT HIER EINE VORGABE.
#
# Frueher stand `${WORKERTRANSFER_JWT_SECRET:-dev-only-secret-...}` da. Das ist
# bequem und falsch: ein eingebauter Vorgabewert IST das Geheimnis, und es liegt
# damit in git. `:?` bricht stattdessen ab und nennt den fehlenden Schluessel.
#
# Wer neu ist: `make env` schreibt eine .env aus .env.example und wuerfelt die
# drei Geheimnisse frisch. Compose liest sie von selbst.
x-umgebung: &umgebung
  ASPNETCORE_ENVIRONMENT: Development
  # WER IM BROWSER RUFEN DARF.
  #
  # Ohne diesen Schluessel faellt Girder in Development auf `localhost:3000`
  # zurueck — also auf einen Ursprung, den es hier nicht gibt, waehrend die
  # Oberflaeche auf 5173 liegt und durch das Gateway auf 8090. Gemessen: eine
  # Vorpruefung kam mit 204 zurueck und ohne einen einzigen
  # `Access-Control-Allow-*`-Kopf. CORS war eingehaengt und liess niemanden
  # durch.
  #
  # Kein Geheimnis, deshalb darf hier eine Vorgabe stehen.
  CORS_ORIGINS: ${WORKERTRANSFER_CORS_ORIGINS:-http://localhost:5173,http://localhost:8090}
  # Ein gemeinsames Geheimnis: identity unterschreibt, alle anderen pruefen
  # (ADR-0007/0015). Die Dienste weisen diese Voreinstellung in
  # Produktion/Staging zurueck.
  JwtSettings__Secret: ${WORKERTRANSFER_JWT_SECRET:?fehlt — `make env` legt eine .env an und wuerfelt ihn}
  JwtSettings__Issuer: workertransfer
  JwtSettings__Audience: workertransfer
  # Gemeinsames Geheimnis der Loeschkaskade (ADR-0027 4.4). AUSDRUECKLICH EIN
  # ANDERES als das der Benachrichtigung: "darf eine Mail anstossen" und "darf
  # alles ueber einen Menschen loeschen" duerfen nicht dasselbe Papier sein.
  # LEER hiesse: der Endpunkt ist zu.
  Erasure__Geheimnis: ${WORKERTRANSFER_ERASURE_SECRET:?fehlt — `make env` legt eine .env an und wuerfelt ihn}

services:
  postgres:
    image: postgres:17-alpine
    container_name: workertransfer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: worker
      POSTGRES_PASSWORD: worker
      # Der Einstiegspunkt legt nur POSTGRES_DB an; jede weitere Datenbank
      # kommt aus initdb (ADR-0004 verbietet eine gemeinsame).
      POSTGRES_DB: identity
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # `pg_isready` allein genuegt NICHT: waehrend initdb laeuft, hoert
      # Postgres nur lokal, und die Probe meldet trotzdem bereit. Die Dienste
      # bekamen dann "connection refused". Eine echte Abfrage ueber TCP ist die
      # Frage, die zaehlt. (Sie loest das Rennen nicht allein — `Wanderung`
      # wartet zusaetzlich, weil es in Kubernetes gar kein depends_on gibt.)
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -U worker -d identity -c 'select 1' || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    # Faengt jede ausgehende Mail ab und zeigt sie unter :8025. Kein Versand
    # nach aussen — eine Entwicklungsumgebung darf niemanden anschreiben.
    image: axllent/mailpit:latest
    container_name: workertransfer-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  identity-service:
    <<: *dienst
    container_name: workertransfer-identity
    environment:
      <<: *umgebung
      SERVICE_DIR: identity
      ASPNETCORE_URLS: "http://0.0.0.0:8001"
      ConnectionStrings__identity: Host=postgres;Port=5432;Database=identity;Username=worker;Password=worker
      Mail__Host: mailpit
      Mail__Port: "1025"
      Mail__Absender: noreply@workertransfer.local
      Mail__WebAdresse: ${WORKERTRANSFER_WEB_URL:-http://localhost:8090}
      Notify__Geheimnis: ${WORKERTRANSFER_NOTIFY_SECRET:?fehlt — `make env` legt eine .env an und wuerfelt ihn}
      Erasure__Adressen__consent: http://consent-service:8002
      Erasure__Adressen__profile: http://profile-service:8003
      Erasure__Adressen__resume: http://resume-service:8004
      Erasure__Adressen__portfolio: http://portfolio-service:8005
      Erasure__Adressen__jobs: http://jobs-service:8006
      Erasure__Adressen__applications: http://applications-service:8007
      Erasure__Adressen__transfer: http://transfer-service:8009
      Erasure__Adressen__notification: http://notification-service:8010
      Erasure__Adressen__github: http://github-service:8011
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    ports:
      - "8001:8001"

  consent-service:
    <<: *dienst
    container_name: workertransfer-consent
    environment:
      <<: *umgebung
      SERVICE_DIR: consent
      ASPNETCORE_URLS: "http://0.0.0.0:8002"
      ConnectionStrings__consent: Host=postgres;Port=5432;Database=consent;Username=worker;Password=worker
    ports:
      - "8002:8002"

  profile-service:
    <<: *dienst
    container_name: workertransfer-profile
    environment:
      <<: *umgebung
      SERVICE_DIR: profile
      ASPNETCORE_URLS: "http://0.0.0.0:8003"
      ConnectionStrings__profile: Host=postgres;Port=5432;Database=profile;Username=worker;Password=worker
      Consent__Adresse: http://consent-service:8002
      # Die KI-Naht. LEER ist gueltig und die Vorgabe: ohne Schluessel wird kein
      # externer Dienst gerufen, und die Oberflaeche sagt das (ADR-0024).
      # Deshalb `:-` und nicht `:?` — ein fehlender Schluessel darf den Stapel
      # nicht anhalten, anders als die drei echten Geheimnisse.
      Draft__Schluessel: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8003:8003"

  resume-service:
    <<: *dienst
    container_name: workertransfer-resume
    environment:
      <<: *umgebung
      SERVICE_DIR: resume
      ASPNETCORE_URLS: "http://0.0.0.0:8004"
      ConnectionStrings__resume: Host=postgres;Port=5432;Database=resume;Username=worker;Password=worker
      Consent__Adresse: http://consent-service:8002
      Notifications__Adresse: http://notification-service:8010
      Notifications__Geheimnis: ${WORKERTRANSFER_NOTIFY_SECRET:?fehlt — `make env` legt eine .env an und wuerfelt ihn}
    ports:
      - "8004:8004"

  portfolio-service:
    <<: *dienst
    container_name: workertransfer-portfolio
    environment:
      <<: *umgebung
      SERVICE_DIR: portfolio
      ASPNETCORE_URLS: "http://0.0.0.0:8005"
      ConnectionStrings__portfolio: Host=postgres;Port=5432;Database=portfolio;Username=worker;Password=worker
      Consent__Adresse: http://consent-service:8002
      Storage__Wurzel: /var/lib/workertransfer/portfolio
    volumes:
      - portfolio-data:/var/lib/workertransfer/portfolio
    ports:
      - "8005:8005"

  jobs-service:
    <<: *dienst
    container_name: workertransfer-jobs
    environment:
      <<: *umgebung
      SERVICE_DIR: jobs
      ASPNETCORE_URLS: "http://0.0.0.0:8006"
      ConnectionStrings__jobs: Host=postgres;Port=5432;Database=jobs;Username=worker;Password=worker
      # Die KI-Naht. LEER ist gueltig und die Vorgabe: ohne Schluessel wird kein
      # externer Dienst gerufen, und die Oberflaeche sagt das (ADR-0024).
      # Deshalb `:-` und nicht `:?` — ein fehlender Schluessel darf den Stapel
      # nicht anhalten, anders als die drei echten Geheimnisse.
      Draft__Schluessel: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8006:8006"

  applications-service:
    <<: *dienst
    container_name: workertransfer-applications
    environment:
      <<: *umgebung
      SERVICE_DIR: applications
      ASPNETCORE_URLS: "http://0.0.0.0:8007"
      ConnectionStrings__applications: Host=postgres;Port=5432;Database=applications;Username=worker;Password=worker
      Consent__Adresse: http://consent-service:8002
      Jobs__Adresse: http://jobs-service:8006
      Notifications__Adresse: http://notification-service:8010
      Notifications__Geheimnis: ${WORKERTRANSFER_NOTIFY_SECRET:?fehlt — `make env` legt eine .env an und wuerfelt ihn}
    ports:
      - "8007:8007"

  companies-service:
    <<: *dienst
    container_name: workertransfer-companies
    environment:
      <<: *umgebung
      # Kein /erasure: dieser Dienst haelt nichts ueber einen
      # natuerlichen Menschen (ADR-0027 2).
      SERVICE_DIR: companies
      ASPNETCORE_URLS: "http://0.0.0.0:8008"
      ConnectionStrings__companies: Host=postgres;Port=5432;Database=companies;Username=worker;Password=worker
    ports:
      - "8008:8008"

  transfer-service:
    <<: *dienst
    container_name: workertransfer-transfer
    environment:
      <<: *umgebung
      SERVICE_DIR: transfer
      ASPNETCORE_URLS: "http://0.0.0.0:8009"
      ConnectionStrings__transfer: Host=postgres;Port=5432;Database=transfer;Username=worker;Password=worker
      Consent__Adresse: http://consent-service:8002
      Notifications__Adresse: http://notification-service:8010
      Notifications__Geheimnis: ${WORKERTRANSFER_NOTIFY_SECRET:?fehlt — `make env` legt eine .env an und wuerfelt ihn}
    ports:
      - "8009:8009"

  notification-service:
    <<: *dienst
    container_name: workertransfer-notification
    environment:
      <<: *umgebung
      SERVICE_DIR: notification
      ASPNETCORE_URLS: "http://0.0.0.0:8010"
      ConnectionStrings__notification: Host=postgres;Port=5432;Database=notification;Username=worker;Password=worker
      Identity__Adresse: http://identity-service:8001
      Identity__Geheimnis: ${WORKERTRANSFER_NOTIFY_SECRET:?fehlt — `make env` legt eine .env an und wuerfelt ihn}
    ports:
      - "8010:8010"

  github-service:
    <<: *dienst
    container_name: workertransfer-github
    environment:
      <<: *umgebung
      SERVICE_DIR: github
      ASPNETCORE_URLS: "http://0.0.0.0:8011"
      ConnectionStrings__github: Host=postgres;Port=5432;Database=github;Username=worker;Password=worker
      Consent__Adresse: http://consent-service:8002
      GitHub__Token: ${WORKERTRANSFER_GITHUB_TOKEN:-}
    ports:
      - "8011:8011"
  gateway:
    <<: *dienst
    container_name: workertransfer-gateway
    environment:
      SERVICE_DIR: gateway
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://0.0.0.0:8090"
      # NUR HIER, und nur wegen des Pruefstands.
      #
      # Die Auth-Bremse steht in ocelot.json und gilt unveraendert, wo nichts
      # anderes gesagt wird. Die Playwright-Reisen legen aber VIERUNDDREISSIG
      # Konten an, alle von einer Herkunft, binnen weniger Minuten — gegen
      # `/auth/register: 5` faellt das um, und zwar voellig zu Recht: kein
      # Mensch legt vierunddreissig Konten an. Ein Pruefstand ist nicht die
      # Bedrohung, gegen die die Bremse gebaut ist.
      #
      # Ein Faktor, kein Schalter: die Bremse laeuft weiter, zaehlt weiter und
      # schluesselt weiter je Herkunft — nur die Decke liegt hoeher. Eine
      # ausgeschaltete Bremse waere in der einzigen laufenden Umgebung gar
      # nicht mehr zu sehen.
      #
      # NICHT ins Helm-Chart uebernehmen. Dort laeuft kein Pruefstand, und ein
      # Faktor in einer Staging-Umgebung waere eine Bremse, die nur so aussieht.
      DistributedRateLimiting__LimitMultiplier: "${WORKERTRANSFER_BREMSE_FAKTOR:-1}"
    depends_on:
      # Nur auf die Datenbank, nicht auf die elf: das Gateway beantwortet
      # /health/live selbst, und ein einzelner kranker Dienst darf es nicht
      # aufhalten.
      postgres:
        condition: service_healthy
    ports:
      # DER Eingang. 8090 und nicht 8080 — zwei Umgebungen, die sich um einen
      # Hafen streiten, ergeben genau die Fehlersuche, in der niemand sagen
      # kann, wer geantwortet hat.
      - "8090:8090"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: workertransfer-web
    restart: unless-stopped
    environment:
      # Alles ueber EINEN Ursprung. Die Oberflaeche kennt keine Einzelhaefen
      # mehr; das Gateway trennt Seite von Ressource ueber Sec-Fetch-Dest.
      VITE_API_BASE_URL: http://localhost:8090
    volumes:
      - ./web/src:/app/src
      - ./web/public:/app/public
      - /app/node_modules
    ports:
      - "5173:5173"

secrets:
  nuget_config:
    # Die Anmeldung an GitHub Packages. Als BuildKit-Geheimnis, damit sie nie
    # eine Schicht wird: ein Zugriff in einem Bild bleibt in jeder Sicherung.
    file: ${HOME}/.nuget/NuGet/NuGet.Config

volumes:
  postgres-data:
  portfolio-data:

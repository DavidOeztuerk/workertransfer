# The whole stack: database, mail catcher, fourteen services, the gateway and
# the UI.
#
#   docker compose up --build     # start everything
#   docker compose down           # stop, keep the data
#   docker compose down -v        # stop and throw the databases away
#
# There is no companion script. `up` migrates every schema and starts the
# service; a fresh clone needs nothing else.
#
# ---------------------------------------------------------------------------
# BUILDING NEEDS A SECRET.
#
# Noelia lives on nuget.org and demands NO sign-in. The build binds the user's
# NuGet configuration in as a BuildKit secret for it (`secrets:` below) — it
# never becomes a layer of the image, and the access does not stand in the
# history.
#
# Whoever does not have one: `dotnet nuget add source ... --username <you>
# --password <token> --store-password-in-clear-text` creates it.
# ---------------------------------------------------------------------------
# ADDING A SERVICE — three steps, no new Dockerfile:
#   1. scripts/initdb/01-create-service-databases.sql: its database.
#      CAREFUL: initdb runs ONLY on an empty volume. On a stack that has run
#      before nothing happens, and the new service spins in "database ... does
#      not exist". Either once `docker compose down -v && docker compose up`,
#      or without losing data:
#        docker compose exec postgres psql -U worker -d postgres \
#          -c 'CREATE DATABASE <name> OWNER worker;'
#   2. docker/dotnet-service.Dockerfile: its entry point into the list.
#   3. Copy a block below and change three things: the name, SERVICE_DIR and
#      the port. And the route in src/gateway/WorkerTransfer.Gateway/ocelot.json.
# ---------------------------------------------------------------------------

x-service: &service
  restart: unless-stopped
  # Ollama and MiniMax run on the machine, not in the container.
  # Without this entry localhost inside the service is the container itself.
  extra_hosts:
    - "host.docker.internal:host-gateway"
  build:
    context: .
    dockerfile: docker/dotnet-service.Dockerfile
  # ONE image for all of them. Who the container is, SERVICE_DIR from the
  # environment says — not a build argument (ADR-0028).
  image: workertransfer-dotnet:local
  depends_on:
    postgres:
      condition: service_healthy
    valkey:
      condition: service_healthy
  # ONE probe for all fourteen, and it asks what counts: /health/live, the same
  # address Kubernetes asks too.
  #
  # The port comes from ASPNETCORE_URLS, so it does not stand here a second
  # time — a second list of ports drifts apart at the first new service. `$$`
  # protects the substitution from compose, `##*:` cuts off everything up to
  # the last colon in dash.
  #
  # Here stood `dotnet --version`. That can never succeed on a RUNTIME IMAGE
  # (no SDK, exit code 155) — every service reported `unhealthy` while
  # answering perfectly. A probe that is always red is worse than none: after
  # the second week nobody reads it any more.
  healthcheck:
    test:
      - CMD-SHELL
      - curl -fsS "http://127.0.0.1:$${ASPNETCORE_URLS##*:}/health/live" > /dev/null || exit 1
    interval: 10s
    timeout: 5s
    retries: 12
    # Migrating takes time, and the first start additionally waits for a
    # reachable database.
    start_period: 60s

# NO SECRET HAS A DEFAULT HERE.
#
# `${WORKERTRANSFER_JWT_SECRET:-dev-only-secret-...}` used to stand here. That
# is convenient and wrong: a built-in default IS the secret, and it then sits
# in git. `:?` aborts instead and names the missing key.
#
# Whoever is new: `make env` writes a .env from .env.example and rolls the
# secrets fresh. Compose reads it by itself.
x-environment: &environment
  ASPNETCORE_ENVIRONMENT: Development
  # WHO MAY CALL FROM A BROWSER.
  #
  # Without this key Noelia falls back to `localhost:3000` in Development — to
  # an origin that does not exist here, while the UI lies on 5173 and, through
  # the gateway, on 8090. Measured: a preflight came back with 204 and without
  # a single `Access-Control-Allow-*` header. CORS was wired in and let nobody
  # through.
  #
  # No secret, so a default may stand here.
  CORS_ORIGINS: ${WORKERTRANSFER_CORS_ORIGINS:-http://localhost:5173,http://localhost:8090}
  # THE PUBLIC KEY GOES TO ALL, THE PRIVATE ONE ONLY TO IDENTITY.
  # So it stands here in the shared anchor and `Jwt__PrivateKey` alone at the
  # identity service — who can mint can therefore be read in this file and not
  # in a line of code.
  Jwt__PublicKey: ${WORKERTRANSFER_JWT_PUBLIC_KEY:?missing — `make env` writes a .env and generates the pair}
  Jwt__KeyId: ${WORKERTRANSFER_JWT_KEY_ID:-k1}
  JwtSettings__Issuer: workertransfer
  JwtSettings__Audience: workertransfer
  # THE SHARED REVOCATION STORE (docs/VISION-FRAGEN.md, I1). A sign-out or an
  # erasure is written here by identity-service and refused by all fourteen.
  # Without it each service honours an old token until it expires.
  ConnectionStrings__valkey: valkey:6379
  # The shared secret of the erasure cascade (ADR-0027 4.4). EXPRESSLY A
  # DIFFERENT ONE from the notification's: "may trigger a mail" and "may erase
  # everything about a person" must not be the same paper. EMPTY would mean:
  # the endpoint is shut.
  Erasure__Secret: ${WORKERTRANSFER_ERASURE_SECRET:?missing — `make env` writes a .env and rolls it}
  # The master key for stored secrets (today: a person's AI key). ROLLING IT
  # MEANS LOSING THEM — there is no versioning.
  WORKERTRANSFER_SECRETS_KEY: ${WORKERTRANSFER_SECRETS_KEY:?missing — `make env` writes a .env and rolls it}
  # The door in front of every service's evidence (ADR-0044). EXPRESSLY A THIRD
  # PAPER, beside the notification's and the erasure's: whoever may trigger a
  # mail need not learn which AI providers this instance uses. EMPTY would
  # mean: the door is shut, and /noelia/… answers 404.
  # Without a fleet name a collector sees fourteen single services instead of
  # one system. Noelia invents none — a guessed one would group strangers.
  Dashboard__Fleet: workertransfer
  Evidence__Secret: ${WORKERTRANSFER_EVIDENCE_SECRET:?missing — `make env` writes a .env and rolls it}

services:
  postgres:
    image: postgres:17-alpine
    container_name: workertransfer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: worker
      POSTGRES_PASSWORD: worker
      # The entrypoint creates only POSTGRES_DB; every further database comes
      # from initdb (ADR-0004 forbids a shared one).
      POSTGRES_DB: identity
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # `pg_isready` alone is NOT enough: while initdb runs, Postgres listens
      # only locally, and the probe reports ready all the same. The services
      # then got "connection refused". A real query over TCP is the question
      # that counts. (It does not settle the race on its own — `SchemaMigration`
      # waits in addition, because in Kubernetes there is no depends_on at
      # all.)
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -U worker -d identity -c 'select 1' || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  valkey:
    # Redis left open source in 2024; Valkey is the BSD-licensed fork under the
    # Linux Foundation, wire-compatible with the client Noelia uses.
    image: valkey/valkey:8-alpine
    container_name: workertransfer-valkey
    restart: unless-stopped
    # Append-only file, so a restart does not forget who was signed out. And
    # noeviction: a revocation evicted for memory would bring a token back.
    command: ["valkey-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    # Catches every outgoing mail and shows it at :8025. Nothing is sent out —
    # a development environment must not write to anybody.
    image: axllent/mailpit:latest
    container_name: workertransfer-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  identity-service:
    <<: *service
    container_name: workertransfer-identity
    environment:
      <<: *environment
      SERVICE_DIR: identity
      # THE ONLY SERVICE WITH THE PRIVATE KEY. A second one would be a second
      # place that can create an acting principal, and nothing further down
      # could tell the two apart.
      Jwt__PrivateKey: ${WORKERTRANSFER_JWT_PRIVATE_KEY:?missing — `make env` writes a .env and generates the pair}
      ASPNETCORE_URLS: "http://0.0.0.0:8001"
      ConnectionStrings__identity: Host=postgres;Port=5432;Database=identity;Username=worker;Password=worker
      Mail__Host: mailpit
      Mail__Port: "1025"
      Mail__Sender: noreply@workertransfer.local
      Mail__WebUrl: ${WORKERTRANSFER_WEB_URL:-http://localhost:8090}
      Notify__Secret: ${WORKERTRANSFER_NOTIFY_SECRET:?missing — `make env` writes a .env and rolls it}
      Erasure__BaseUrls__consent: http://consent-service:8002
      Erasure__BaseUrls__profile: http://profile-service:8003
      Erasure__BaseUrls__resume: http://resume-service:8004
      Erasure__BaseUrls__portfolio: http://portfolio-service:8005
      Erasure__BaseUrls__jobs: http://jobs-service:8006
      Erasure__BaseUrls__applications: http://applications-service:8007
      Erasure__BaseUrls__transfer: http://transfer-service:8009
      Erasure__BaseUrls__notification: http://notification-service:8010
      Erasure__BaseUrls__github: http://github-service:8011
      Erasure__BaseUrls__scout: http://scout-service:8012
      Erasure__BaseUrls__advisor: http://advisor-service:8013
      Erasure__BaseUrls__assessment: http://assessment-service:8014
      Erasure__BaseUrls__messages: http://messages-service:8015
      # Signing in with Google, Microsoft, Apple (ADR-0053). Without a client
      # id a provider is off and no button appears — that is the default,
      # hence `:-` and not `:?`. The callback runs through the gateway; the
      # address registered at each provider is
      # `{CallbackBase}/auth/external/{google|microsoft|apple}/callback`.
      # The endpoints were measured from each discovery document on
      # 18.10.2026 and stand here so the egress boundary lets them through.
      ExternalLogin__CallbackBase: ${WORKERTRANSFER_PUBLIC_URL:-http://localhost:8090}
      ExternalLogin__Google__ClientId: ${WORKERTRANSFER_GOOGLE_CLIENT_ID:-}
      ExternalLogin__Google__ClientSecret: ${WORKERTRANSFER_GOOGLE_CLIENT_SECRET:-}
      ExternalLogin__Google__AuthorizationEndpoint: https://accounts.google.com/o/oauth2/v2/auth
      ExternalLogin__Google__TokenEndpoint: https://oauth2.googleapis.com/token
      ExternalLogin__Google__Issuer: https://accounts.google.com
      ExternalLogin__Microsoft__ClientId: ${WORKERTRANSFER_MICROSOFT_CLIENT_ID:-}
      ExternalLogin__Microsoft__ClientSecret: ${WORKERTRANSFER_MICROSOFT_CLIENT_SECRET:-}
      ExternalLogin__Microsoft__AuthorizationEndpoint: https://login.microsoftonline.com/common/oauth2/v2.0/authorize
      ExternalLogin__Microsoft__TokenEndpoint: https://login.microsoftonline.com/common/oauth2/v2.0/token
      ExternalLogin__Microsoft__Issuer: https://login.microsoftonline.com/{tenantid}/v2.0
      ExternalLogin__Apple__ClientId: ${WORKERTRANSFER_APPLE_CLIENT_ID:-}
      ExternalLogin__Apple__TeamId: ${WORKERTRANSFER_APPLE_TEAM_ID:-}
      ExternalLogin__Apple__KeyId: ${WORKERTRANSFER_APPLE_KEY_ID:-}
      ExternalLogin__Apple__PrivateKey: ${WORKERTRANSFER_APPLE_PRIVATE_KEY:-}
      ExternalLogin__Apple__AuthorizationEndpoint: https://appleid.apple.com/auth/authorize
      ExternalLogin__Apple__TokenEndpoint: https://appleid.apple.com/auth/token
      ExternalLogin__Apple__Issuer: https://appleid.apple.com
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    ports:
      - "127.0.0.1:8001:8001"

  consent-service:
    <<: *service
    container_name: workertransfer-consent
    environment:
      <<: *environment
      SERVICE_DIR: consent
      ASPNETCORE_URLS: "http://0.0.0.0:8002"
      ConnectionStrings__consent: Host=postgres;Port=5432;Database=consent;Username=worker;Password=worker
    ports:
      - "127.0.0.1:8002:8002"

  profile-service:
    <<: *service
    container_name: workertransfer-profile
    environment:
      <<: *environment
      SERVICE_DIR: profile
      ASPNETCORE_URLS: "http://0.0.0.0:8003"
      ConnectionStrings__profile: Host=postgres;Port=5432;Database=profile;Username=worker;Password=worker
      Consent__BaseUrl: http://consent-service:8002
      # The internal door through which scout-service searches (ADR-0036).
      # EMPTY means there: the door is SHUT — and it then answers 404 instead of
      # 401, so it does not give itself away through a method.
      #
      # WITHOUT THIS LINE THE SCOUT SEARCHES INTO THE VOID, and silently: the
      # door says 404, and an empty hit list looks like "there is nobody".
      # Measured exactly like that on 11.09.2026 — twelve E2E journeys red, the
      # route map green, because the status codes were right.
      Notify__Secret: ${WORKERTRANSFER_NOTIFY_SECRET:?missing — `make env` writes a .env and rolls it}
      # The AI seam. EMPTY is valid and the default: without a key the
      # platform has no model, and the UI says so (ADR-0024). That is why `:-`
      # and not `:?` — a missing key must not stop the stack, unlike the three
      # real secrets. Until the start the platform's model is the local Ollama
      # (ADR-0051), which reads no key: any value switches it on.
      Draft__ApiKey: ${WORKERTRANSFER_AI_KEY:-}
      # The address stands HERE and not only as a default in the source: a
      # built-in destination abroad is exactly what the sovereignty report is
      # meant to surface — and the egress boundary reads its allowed hosts from
      # the configuration (ServiceFoundation.cs).
      Draft__BaseUrl: ${WORKERTRANSFER_AI_URL:-http://host.docker.internal:11434/v1/chat/completions}
      Draft__Provider: ${WORKERTRANSFER_AI_PROVIDER:-openai_compatible}
      Draft__Model: ${WORKERTRANSFER_AI_MODEL:-qwen2.5-coder:7b}
      # A person's own key drafts her profile text instead of the platform's
      # model (ADR-0051): fetched behind the shared secret, and the two hosts
      # it may reach declared for the egress boundary.
      Identity__BaseUrl: http://identity-service:8001
      Identity__Secret: ${WORKERTRANSFER_NOTIFY_SECRET:?missing — `make env` writes a .env and rolls it}
      Draft__AllowedTargets__0: https://api.anthropic.com
      Draft__AllowedTargets__1: https://api.openai.com
    ports:
      - "127.0.0.1:8003:8003"

  resume-service:
    <<: *service
    container_name: workertransfer-resume
    environment:
      <<: *environment
      SERVICE_DIR: resume
      ASPNETCORE_URLS: "http://0.0.0.0:8004"
      ConnectionStrings__resume: Host=postgres;Port=5432;Database=resume;Username=worker;Password=worker
      # Who may ask a person for their CV: at least a `recruiter` (ADR-0048),
      # read from identity-service's membership table per request. Without
      # these two lines the request route answers 503 — rightly, and visibly.
      Identity__BaseUrl: http://identity-service:8001
      Identity__Secret: ${WORKERTRANSFER_NOTIFY_SECRET:?missing — `make env` writes a .env and rolls it}
      Consent__BaseUrl: http://consent-service:8002
      Notifications__BaseUrl: http://notification-service:8010
      Notifications__Secret: ${WORKERTRANSFER_NOTIFY_SECRET:?missing — `make env` writes a .env and rolls it}
      # Where the certificates lie. A VOLUME and not a folder in the image: an
      # `up -d --build` replaces the container, and the files would be gone
      # with it — while their rows stayed in the database. Exactly this
      # half-gone-half-there state is the worst (ADR-0035).
      #
      # The volume comes as root:root. The entrypoint chowns it to uid 10001
      # and gives up root afterwards — otherwise 500 at the first subdirectory
      # (measured: UnauthorizedAccessException on /daten/ablage/<subject>, the
      # path's name then).
      DocumentStore__Folder: /data/document-store
    volumes:
      - resume-document-store:/data/document-store
    ports:
      - "127.0.0.1:8004:8004"

  portfolio-service:
    <<: *service
    container_name: workertransfer-portfolio
    environment:
      <<: *environment
      SERVICE_DIR: portfolio
      ASPNETCORE_URLS: "http://0.0.0.0:8005"
      ConnectionStrings__portfolio: Host=postgres;Port=5432;Database=portfolio;Username=worker;Password=worker
      Consent__BaseUrl: http://consent-service:8002
      Storage__Root: /var/lib/workertransfer/portfolio
    volumes:
      - portfolio-data:/var/lib/workertransfer/portfolio
    ports:
      - "127.0.0.1:8005:8005"

  jobs-service:
    <<: *service
    container_name: workertransfer-jobs
    environment:
      <<: *environment
      SERVICE_DIR: jobs
      ASPNETCORE_URLS: "http://0.0.0.0:8006"
      ConnectionStrings__jobs: Host=postgres;Port=5432;Database=jobs;Username=worker;Password=worker
      # The role lookup. Who is `admin` is decided by identity-service's
      # membership table — per request and not by the token: a role in the
      # token would take effect after a removal only at expiry. The same
      # address and the same secret as every other internal door.
      #
      # WITHOUT these two lines every protected route answers 503 (not 403):
      # "did not answer" is not the same as "no". And the address stands here
      # also because the egress boundary derives its allowed hosts from the
      # configuration (ServiceFoundation.cs).
      Identity__BaseUrl: http://identity-service:8001
      Identity__Secret: ${WORKERTRANSFER_NOTIFY_SECRET:?missing — `make env` writes a .env and rolls it}
      # The AI seam. EMPTY is valid and the default: without a key the
      # platform has no model, and the UI says so (ADR-0024). That is why `:-`
      # and not `:?` — a missing key must not stop the stack, unlike the three
      # real secrets. Until the start the platform's model is the local Ollama
      # (ADR-0051), which reads no key: any value switches it on.
      Draft__ApiKey: ${WORKERTRANSFER_AI_KEY:-}
      # The address stands HERE and not only as a default in the source: a
      # built-in destination abroad is exactly what the sovereignty report is
      # meant to surface — and the egress boundary reads its allowed hosts from
      # the configuration (ServiceFoundation.cs).
      Draft__BaseUrl: ${WORKERTRANSFER_AI_URL:-http://host.docker.internal:11434/v1/chat/completions}
      Draft__Provider: ${WORKERTRANSFER_AI_PROVIDER:-openai_compatible}
      Draft__Model: ${WORKERTRANSFER_AI_MODEL:-qwen2.5-coder:7b}
      # A company's own key drafts its advert instead of the platform's model
      # (ADR-0051, Bauliste 6): fetched behind the shared secret, and the two
      # hosts it may reach declared for the egress boundary.
      Draft__AllowedTargets__0: https://api.anthropic.com
      Draft__AllowedTargets__1: https://api.openai.com
      # Where a company's adverts come from (ADR-0052): the ATS' official
      # APIs. They stand here for the same reason as the model's address —
      # the egress boundary lets through what the configuration names.
      # Personio is a domain, not an address: every company has a host below it.
      Sources__Greenhouse: https://boards-api.greenhouse.io
      Sources__Lever: https://api.lever.co
      Sources__Personio: jobs.personio.de
    ports:
      - "127.0.0.1:8006:8006"

  applications-service:
    <<: *service
    container_name: workertransfer-applications
    environment:
      <<: *environment
      SERVICE_DIR: applications
      ASPNETCORE_URLS: "http://0.0.0.0:8007"
      ConnectionStrings__applications: Host=postgres;Port=5432;Database=applications;Username=worker;Password=worker
      Consent__BaseUrl: http://consent-service:8002
      Jobs__BaseUrl: http://jobs-service:8006
      Notifications__BaseUrl: http://notification-service:8010
      Notifications__Secret: ${WORKERTRANSFER_NOTIFY_SECRET:?missing — `make env` writes a .env and rolls it}
      # A company's members — the same address and the same secret as the
      # notification path. A company has no mailbox.
      Identity__BaseUrl: http://identity-service:8001
      Identity__Secret: ${WORKERTRANSFER_NOTIFY_SECRET:?missing — `make env` writes a .env and rolls it}
      # The cover-letter agent. Empty means: NOTHING is called, and the UI says
      # so — instead of showing an empty draft somebody releases by accident
      # (ADR-0034).
      Draft__ApiKey: ${WORKERTRANSFER_AI_KEY:-}
      # The address stands HERE and not only as a default in the source: a
      # built-in destination abroad is exactly what the sovereignty report is
      # meant to surface — and the egress boundary reads its allowed hosts from
      # the configuration (ServiceFoundation.cs).
      Draft__BaseUrl: ${WORKERTRANSFER_AI_URL:-http://host.docker.internal:11434/v1/chat/completions}
      Draft__Provider: ${WORKERTRANSFER_AI_PROVIDER:-openai_compatible}
      Draft__Model: ${WORKERTRANSFER_AI_MODEL:-qwen2.5-coder:7b}
      # THE TARGETS OF A PERSON'S OWN KEY (ADR-0051).
      #
      # `Draft__BaseUrl` above is the platform's model. A person can deposit a
      # key of her own — Anthropic or OpenAI for now — and it then drafts
      # instead. Its address stands in the DATABASE, not in the configuration,
      # and is therefore invisible to the egress boundary: measured on
      # 10.09.2026 every cover-letter job answered `EgressDeniedException` for a
      # target nobody had declared — the job started, never wrote, and in the
      # UI simply nothing happened.
      #
      # So the platform declares here the two hosts a person's key may reach,
      # and the person cannot type an address at all. The value is read by
      # NOBODY except the derivation in `ServiceFoundation`, which takes the
      # host from every configuration value that reads as an absolute http
      # address.
      Draft__AllowedTargets__0: https://api.anthropic.com
      Draft__AllowedTargets__1: https://api.openai.com
      # Where the applying person's OWN details come from. Fetched on the
      # server and not sent by the browser: "only the person's own data" is a
      # promise only the server can keep.
      Lookup__Identity: http://identity-service:8001
      Lookup__Profile: http://profile-service:8003
      Lookup__Resume: http://resume-service:8004
      Lookup__Companies: http://companies-service:8008
    ports:
      - "127.0.0.1:8007:8007"

  companies-service:
    <<: *service
    container_name: workertransfer-companies
    environment:
      <<: *environment
      # No /erasure: this service holds nothing about a natural person
      # (ADR-0027 2).
      SERVICE_DIR: companies
      ASPNETCORE_URLS: "http://0.0.0.0:8008"
      ConnectionStrings__companies: Host=postgres;Port=5432;Database=companies;Username=worker;Password=worker
      # The role lookup. Who is `admin` is decided by identity-service's
      # membership table — per request and not by the token: a role in the
      # token would take effect after a removal only at expiry. The same
      # address and the same secret as every other internal door.
      #
      # WITHOUT these two lines every protected route answers 503 (not 403):
      # "did not answer" is not the same as "no". And the address stands here
      # also because the egress boundary derives its allowed hosts from the
      # configuration (ServiceFoundation.cs).
      Identity__BaseUrl: http://identity-service:8001
      Identity__Secret: ${WORKERTRANSFER_NOTIFY_SECRET:?missing — `make env` writes a .env and rolls it}
    ports:
      - "127.0.0.1:8008:8008"

  transfer-service:
    <<: *service
    container_name: workertransfer-transfer
    environment:
      <<: *environment
      SERVICE_DIR: transfer
      ASPNETCORE_URLS: "http://0.0.0.0:8009"
      ConnectionStrings__transfer: Host=postgres;Port=5432;Database=transfer;Username=worker;Password=worker
      # The role lookup. Who is `admin` is decided by identity-service's
      # membership table — per request and not by the token: a role in the
      # token would take effect after a removal only at expiry. The same
      # address and the same secret as every other internal door.
      #
      # WITHOUT these two lines every protected route answers 503 (not 403):
      # "did not answer" is not the same as "no". And the address stands here
      # also because the egress boundary derives its allowed hosts from the
      # configuration (ServiceFoundation.cs).
      Identity__BaseUrl: http://identity-service:8001
      Identity__Secret: ${WORKERTRANSFER_NOTIFY_SECRET:?missing — `make env` writes a .env and rolls it}
      Consent__BaseUrl: http://consent-service:8002
      Notifications__BaseUrl: http://notification-service:8010
      Notifications__Secret: ${WORKERTRANSFER_NOTIFY_SECRET:?missing — `make env` writes a .env and rolls it}
    ports:
      - "127.0.0.1:8009:8009"

  notification-service:
    <<: *service
    container_name: workertransfer-notification
    environment:
      <<: *environment
      SERVICE_DIR: notification
      ASPNETCORE_URLS: "http://0.0.0.0:8010"
      ConnectionStrings__notification: Host=postgres;Port=5432;Database=notification;Username=worker;Password=worker
      Identity__BaseUrl: http://identity-service:8001
      Identity__Secret: ${WORKERTRANSFER_NOTIFY_SECRET:?missing — `make env` writes a .env and rolls it}
    ports:
      - "127.0.0.1:8010:8010"

  github-service:
    <<: *service
    container_name: workertransfer-github
    environment:
      <<: *environment
      SERVICE_DIR: github
      ASPNETCORE_URLS: "http://0.0.0.0:8011"
      ConnectionStrings__github: Host=postgres;Port=5432;Database=github;Username=worker;Password=worker
      Consent__BaseUrl: http://consent-service:8002
      GitHub__Token: ${WORKERTRANSFER_GITHUB_TOKEN:-}
      # Empty means: no sign-in via GitHub, and the gist stays the path.
      # A default that contains a secret IS the secret.
      GitHub__OAuth__ClientId: ${WORKERTRANSFER_GITHUB_OAUTH_ID:-}
      GitHub__OAuth__Secret: ${WORKERTRANSFER_GITHUB_OAUTH_SECRET:-}
      GitHub__OAuth__RedirectUrl: ${WORKERTRANSFER_GITHUB_OAUTH_REDIRECT_URL:-}
      # As with Draft__BaseUrl: the target belongs in the configuration, so the
      # report and the egress boundary see it.
      GitHub__BaseUrl: https://api.github.com
      # The sign-in's code exchange goes to github.com, not to the API. As a
      # default in the source only, the egress boundary refused it, and every
      # OAuth sign-in ended in "github is unreachable".
      GitHub__OAuth__AuthorizeUrl: https://github.com
    ports:
      - "127.0.0.1:8011:8011"
  scout-service:
    <<: *service
    container_name: workertransfer-scout
    environment:
      <<: *environment
      SERVICE_DIR: scout
      ASPNETCORE_URLS: "http://0.0.0.0:8012"
      ConnectionStrings__scout: Host=postgres;Port=5432;Database=scout;Username=worker;Password=worker
      # EVERY TARGET OF THIS SERVICE STANDS HERE, AND BECAUSE IT HAS TO STAND
      # HERE: the egress boundary derives its allowed hosts from the
      # configuration (ServiceFoundation). A target that stands only in the
      # source is refused — without a log line, and the outage then looks like
      # an outage of the other service.
      Consent__BaseUrl: http://consent-service:8002
      # The internal door through which the search goes. The same shared secret
      # as every other internal door — and expressly not the erasure's.
      # WITHOUT these two lines /scout/candidates answers 503: "not set up" must
      # not look like "there is nobody".
      Profile__BaseUrl: http://profile-service:8003
      Profile__Secret: ${WORKERTRANSFER_NOTIFY_SECRET:?missing — `make env` writes a .env and rolls it}
      # The evidence. github-service, NOT github.com: this service never asks
      # GitHub itself.
      GitHub__BaseUrl: http://github-service:8011
      # The job advert against which the reachability tick is formed
      # (ADR-0041). Three fields are read: place, postal code, remote mode.
      # Without this line every hit carries a dash — and that is a complete
      # answer, no outage.
      Jobs__BaseUrl: http://jobs-service:8006
      # "Your profile was discovered" (ADR-0033) — via the outbox, free of
      # content, and the message names no company.
      Notifications__BaseUrl: http://notification-service:8010
      Notifications__Secret: ${WORKERTRANSFER_NOTIFY_SECRET:?missing — `make env` writes a .env and rolls it}
      # The draft of an approach. Empty means: NOTHING is called, and the UI
      # says so — instead of showing an empty draft somebody sends to a person
      # by accident (ADR-0024).
      Draft__ApiKey: ${WORKERTRANSFER_AI_KEY:-}
      Draft__BaseUrl: ${WORKERTRANSFER_AI_URL:-http://host.docker.internal:11434/v1/chat/completions}
      Draft__Provider: ${WORKERTRANSFER_AI_PROVIDER:-openai_compatible}
      Draft__Model: ${WORKERTRANSFER_AI_MODEL:-qwen2.5-coder:7b}
      # A company's own key drafts its approach instead of the platform's
      # model (ADR-0051, Bauliste 6): asked at identity-service behind the
      # shared secret, and the two hosts it may reach declared for the egress
      # boundary.
      Identity__BaseUrl: http://identity-service:8001
      Identity__Secret: ${WORKERTRANSFER_NOTIFY_SECRET:?missing — `make env` writes a .env and rolls it}
      Draft__AllowedTargets__0: https://api.anthropic.com
      Draft__AllowedTargets__1: https://api.openai.com
    ports:
      - "127.0.0.1:8012:8012"

  advisor-service:
    <<: *service
    container_name: workertransfer-advisor
    environment:
      <<: *environment
      SERVICE_DIR: advisor
      ASPNETCORE_URLS: "http://0.0.0.0:8013"
      ConnectionStrings__advisor: Host=postgres;Port=5432;Database=advisor;Username=worker;Password=worker
      # EVERY TARGET OF THIS SERVICE STANDS HERE, AND BECAUSE IT HAS TO STAND
      # HERE: the egress boundary derives its allowed hosts from the
      # configuration (ServiceFoundation). A target that stands only in the
      # source is refused — without a log line, and the outage then looks like
      # an outage of the other service.
      #
      # The ledger. It carries the STAGE of a conversation (ADR-0037): read at
      # every request, written at every release. WITHOUT this line every route
      # answers 503 — rightly, and visibly.
      Consent__BaseUrl: http://consent-service:8002
      # identity-service's internal doors, behind the shared secret: a
      # company's domain (so an exclusion can take effect) and a person's civil
      # name (only from stage 3, and only AFTER the ledger has confirmed it).
      Identity__BaseUrl: http://identity-service:8001
      Identity__Secret: ${WORKERTRANSFER_NOTIFY_SECRET:?missing — `make env` writes a .env and rolls it}
      # The handover of the agreement. The triangle consensus stands THERE and
      # is not rebuilt here: transfer-service checks itself whether the market
      # status is released and the person approachable.
      Transfer__BaseUrl: http://transfer-service:8009
      # "A company has opened a conversation" — via the outbox, free of content,
      # and the message names no company (ADR-0025).
      Notifications__BaseUrl: http://notification-service:8010
      Notifications__Secret: ${WORKERTRANSFER_NOTIFY_SECRET:?missing — `make env` writes a .env and rolls it}
    ports:
      - "127.0.0.1:8013:8013"

  assessment-service:
    <<: *service
    container_name: workertransfer-assessment
    environment:
      <<: *environment
      SERVICE_DIR: assessment
      ASPNETCORE_URLS: "http://0.0.0.0:8014"
      ConnectionStrings__assessment: Host=postgres;Port=5432;Database=assessment;Username=worker;Password=worker
      # EVERY TARGET OF THIS SERVICE STANDS HERE, AND BECAUSE IT HAS TO STAND
      # HERE: the egress boundary derives its allowed hosts from the
      # configuration (ServiceFoundation). A target that stands only in the
      # source is refused — without a log line, and the outage then looks like
      # an outage of the other service.
      #
      # The ledger, and it is this service's ONLY guard: a work sample stands on
      # `profile.visibility:*` and on no capability of its own (ADR-0042).
      # WITHOUT this line the company side answers 503 — rightly, and visibly.
      # The person side keeps answering, and that is on purpose: whoever wants
      # to read their evaluation needs no ledger for it.
      Consent__BaseUrl: http://consent-service:8002
      # "Something has moved on your work sample" — via the outbox, free of
      # content (ADR-0025). No task text and no evaluation travel along: the
      # mail may land in the current employer's mailbox.
      Notifications__BaseUrl: http://notification-service:8010
      Notifications__Secret: ${WORKERTRANSFER_NOTIFY_SECRET:?missing — `make env` writes a .env and rolls it}
      # EXPRESSLY NOT ENTERED: the address a person submits. It is stored and
      # shown, never fetched — a service that fetched it would carry an address
      # chosen by a stranger into a server request.
    ports:
      - "127.0.0.1:8014:8014"

  messages-service:
    <<: *service
    container_name: workertransfer-messages
    environment:
      <<: *environment
      SERVICE_DIR: messages
      ASPNETCORE_URLS: "http://0.0.0.0:8015"
      ConnectionStrings__messages: Host=postgres;Port=5432;Database=messages;Username=worker;Password=worker
      # One conversation per process (ADR-0047). WHO BELONGS TO IT is asked of
      # the process's own service, with the caller's token, at every request —
      # without this line every conversation answers 503.
      Applications__BaseUrl: http://applications-service:8007
      # An APPROACH stands on the ledger (`profile.visibility:*`): the company
      # side asks it at every request. Without this line every approach
      # answers 503 — rightly, and visibly.
      Consent__BaseUrl: http://consent-service:8002
      # The AI advisor reads the person's OWN facts with her token (ADR-0049):
      # her mandate and her earliest start. Without these lines it advises
      # without them — and says so.
      OwnFacts__AdvisorUrl: http://advisor-service:8013
      OwnFacts__TransferUrl: http://transfer-service:8009
      # A company's members — the recipients when the person writes — and a
      # person's own AI access for their drafts. The same door and secret as
      # everywhere.
      Identity__BaseUrl: http://identity-service:8001
      Identity__Secret: ${WORKERTRANSFER_NOTIFY_SECRET:?missing — `make env` writes a .env and rolls it}
      # "A message arrived" — via the outbox, free of content (ADR-0025).
      Notifications__BaseUrl: http://notification-service:8010
      Notifications__Secret: ${WORKERTRANSFER_NOTIFY_SECRET:?missing — `make env` writes a .env and rolls it}
      # The reply drafts. Empty key means: no draft, and the UI says so.
      Draft__ApiKey: ${WORKERTRANSFER_AI_KEY:-}
      Draft__BaseUrl: ${WORKERTRANSFER_AI_URL:-http://host.docker.internal:11434/v1/chat/completions}
      Draft__Provider: ${WORKERTRANSFER_AI_PROVIDER:-openai_compatible}
      Draft__Model: ${WORKERTRANSFER_AI_MODEL:-qwen2.5-coder:7b}
      # Where a person's OWN key may reach — the same declaration as for the
      # cover letter (ADR-0051).
      Draft__AllowedTargets__0: https://api.anthropic.com
      Draft__AllowedTargets__1: https://api.openai.com
    ports:
      - "127.0.0.1:8015:8015"

  gateway:
    <<: *service
    container_name: workertransfer-gateway
    environment:
      SERVICE_DIR: gateway
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://0.0.0.0:8090"
      # ONLY HERE, and only because of the test bench.
      #
      # The auth brake stands in ocelot.json and applies unchanged wherever
      # nothing else is said. The Playwright journeys, however, create
      # THIRTY-FOUR accounts, all from one origin, within a few minutes —
      # against `/auth/register: 5` that falls over, and quite rightly so: no
      # person creates thirty-four accounts. A test bench is not the threat the
      # brake is built against.
      #
      # A factor, not a switch: the brake keeps running, keeps counting and
      # keeps keying per origin — only the ceiling lies higher. A switched-off
      # brake would no longer be visible at all in the only running
      # environment.
      #
      # DO NOT take this into the Helm chart. No test bench runs there, and a
      # factor in a staging environment would be a brake that only looks like
      # one.
      DistributedRateLimiting__LimitMultiplier: "${WORKERTRANSFER_BRAKE_FACTOR:-1}"
    depends_on:
      # Only on the database, not on the services: the gateway answers
      # /health/live itself, and a single sick service must not hold it up.
      postgres:
        condition: service_healthy
    ports:
      # THE entrance. The same host port the kind cluster's gateway uses — on
      # purpose: the two environments cannot run at the same time anyway
      # (scripts/k8s-up.sh checks the ports and names them), and one address
      # for the API in both is the better trade.
      - "8090:8090"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: workertransfer-web
    restart: unless-stopped
    environment:
      # The UI calls the gateway for every request; the gateway serves the API
      # and nothing else (ADR-0040).
      VITE_API_BASE_URL: http://localhost:8090
      # Files from Google Drive and Dropbox (ADR-0054) — empty means no button.
      # Public values by nature: they stand in every browser that loads the page.
      VITE_GOOGLE_PICKER_CLIENT_ID: ${WORKERTRANSFER_GOOGLE_PICKER_CLIENT_ID:-}
      VITE_GOOGLE_PICKER_API_KEY: ${WORKERTRANSFER_GOOGLE_PICKER_API_KEY:-}
      VITE_GOOGLE_PICKER_APP_ID: ${WORKERTRANSFER_GOOGLE_PICKER_APP_ID:-}
      VITE_DROPBOX_APP_KEY: ${WORKERTRANSFER_DROPBOX_APP_KEY:-}
    volumes:
      - ./web/src:/app/src
      - ./web/public:/app/public
      - /app/node_modules
    ports:
      - "5173:5173"

volumes:
  postgres-data:
  valkey-data:
  portfolio-data:
  resume-document-store:

# The complete local stack: database, every backend service, and the web app.
#
#   docker compose up --build     # start everything
#   docker compose down           # stop, keep the data
#   docker compose down -v        # stop and drop the databases
#
# There is no companion script. `up` migrates each service and starts it; a
# fresh clone needs nothing else.
#
# Source is bind-mounted and every service runs with reload, so edits on the
# host take effect without a rebuild. Rebuild only when a dependency changes.
#
# Redis, RabbitMQ, MinIO, Jaeger and Prometheus are deliberately absent — no
# service wires them yet, and unused infrastructure rots. They arrive with the
# first real consumer (ULTRAPLAN Phase 9/10).
#
# ---------------------------------------------------------------------------
# ADDING A SERVICE — three steps, no new Dockerfile:
#   1. scripts/initdb/01-create-service-databases.sql: add its database.
#      ACHTUNG: initdb läuft NUR bei leerem Volume. Auf einem Stack, der schon
#      lief, passiert also nichts, und der neue Service dreht sich in
#      "database ... does not exist" im Kreis. Entweder einmal
#      `docker compose down -v && docker compose up`, oder ohne Datenverlust:
#        docker compose exec postgres psql -U worker -d postgres \
#          -c 'CREATE DATABASE <name> OWNER worker;'
#   2. Copy the consent-service block below and change four things: the service
#      name, SERVICE_DIR (its apps/<dir>), WORKER_PORT + the published port, and
#      the uvicorn module in `command`.
#   3. Add it to `web.depends_on` if the frontend calls it, und ergänze eine
#      VITE_<NAME>_BASE_URL. ACHTUNG: `docker compose restart web` übernimmt
#      neue Variablen NICHT — es startet den Container mit seiner alten
#      Konfiguration. Nötig ist `docker compose up -d web`.
# ---------------------------------------------------------------------------

x-service: &service
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    mailpit:
      condition: service_healthy
  volumes:
    - ./:/app
    # Anonymous volume: keeps the host's .venv (macOS binaries, wrong platform)
    # from shadowing anything under /app. The container's environment lives at
    # /opt/venv and is untouched by the bind mount above.
    - /app/.venv

x-service-env: &service-env
  WORKER_ENVIRONMENT: local
  # 0.0.0.0, not the 127.0.0.1 default: inside a container the loopback default
  # would make the published port answer nothing.
  WORKER_HOST: "0.0.0.0"
  # identity-service signs, every other service verifies — one shared secret
  # until the gateway lands (ADR-0007/0015). Override via a .env file or the
  # environment; the services refuse this default in production/staging.
  WORKER_JWT_SECRET: ${WORKER_JWT_SECRET:-dev-only-secret-change-me-in-production-32bytes}
  # The browser origin of the Vite dev server. Comma-separated is accepted.
  WORKER_CORS_ALLOW_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
  # Mail goes to the catcher, never outward. No credentials: Mailpit speaks no
  # AUTH, and the mailer only calls login() when both are set.
  WORKER_SMTP_HOST: mailpit
  WORKER_SMTP_PORT: "1025"
  WORKER_MAIL_FROM: noreply@workertransfer.local
  # The base for confirmation links — must be what the BROWSER can reach, not a
  # compose service name.
  WORKER_PUBLIC_WEB_URL: ${WORKER_PUBLIC_WEB_URL:-http://localhost:5173}

services:
  postgres:
    image: postgres:17-alpine
    container_name: workertransfer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: worker
      POSTGRES_PASSWORD: worker
      # The entrypoint only creates POSTGRES_DB; every further service database
      # comes from initdb (ADR-0004 forbids a shared database).
      POSTGRES_DB: identity
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Every service waits on this before migrating.
      test: ["CMD-SHELL", "pg_isready -U worker -d identity"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    # Fängt jede ausgehende Mail ab und zeigt sie unter :8025. Kein Versand nach
    # außen — eine Entwicklungsumgebung darf niemanden anschreiben.
    image: axllent/mailpit:latest
    container_name: workertransfer-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP — hier hinein sprechen die Services
      - "8025:8025" # Weboberfläche — hier liest man die Mails
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  identity-service:
    <<: *service
    container_name: workertransfer-identity
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE_DIR: identity-service
    environment:
      <<: *service-env
      WORKER_PORT: "8001"
      WORKER_DATABASE_URL: postgresql+asyncpg://worker:worker@postgres:5432/identity
    ports:
      - "8001:8001"
    command:
      - uvicorn
      - identity_service.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8001"
      - --reload
      - --reload-dir
      - /app/apps/identity-service/src
      - --reload-dir
      - /app/packages
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request;urllib.request.urlopen("http://localhost:8001/health/live")
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 40s

  consent-service:
    <<: *service
    container_name: workertransfer-consent
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE_DIR: consent-service
    environment:
      <<: *service-env
      WORKER_PORT: "8002"
      WORKER_DATABASE_URL: postgresql+asyncpg://worker:worker@postgres:5432/consent
    ports:
      - "8002:8002"
    command:
      - uvicorn
      - consent_service.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8002"
      - --reload
      - --reload-dir
      - /app/apps/consent-service/src
      - --reload-dir
      - /app/packages
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request;urllib.request.urlopen("http://localhost:8002/health/live")
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 40s

  profile-service:
    <<: *service
    container_name: workertransfer-profile
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE_DIR: profile-service
    environment:
      <<: *service-env
      WORKER_PORT: "8003"
      WORKER_DATABASE_URL: postgresql+asyncpg://worker:worker@postgres:5432/profile
      # Der Profile-Service fragt den Ledger, bevor er ein fremdes Profil zeigt
      # (ADR-0013, synchron und ohne Cache). Servicename, nicht localhost:
      # der Aufruf läuft im Compose-Netz.
      WORKER_CONSENT_BASE_URL: http://consent-service:8002
    ports:
      - "8003:8003"
    command:
      - uvicorn
      - profile_service.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8003"
      - --reload
      - --reload-dir
      - /app/apps/profile-service/src
      - --reload-dir
      - /app/packages
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request;urllib.request.urlopen("http://localhost:8003/health/live")
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 40s

  resume-service:
    <<: *service
    container_name: workertransfer-resume
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE_DIR: resume-service
    environment:
      <<: *service-env
      WORKER_PORT: "8004"
      WORKER_DATABASE_URL: postgresql+asyncpg://worker:worker@postgres:5432/resume
      # Der Lebenslauf wird je Unternehmen einzeln freigegeben; die Berechtigung
      # steht im Ledger (Capability resume.visibility:tenant:<id>).
      WORKER_CONSENT_BASE_URL: http://consent-service:8002
    ports:
      - "8004:8004"
    command:
      - uvicorn
      - resume_service.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8004"
      - --reload
      - --reload-dir
      - /app/apps/resume-service/src
      - --reload-dir
      - /app/packages
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request;urllib.request.urlopen("http://localhost:8004/health/live")
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 40s

  portfolio-service:
    <<: *service
    container_name: workertransfer-portfolio
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE_DIR: portfolio-service
    environment:
      <<: *service-env
      WORKER_PORT: "8005"
      WORKER_DATABASE_URL: postgresql+asyncpg://worker:worker@postgres:5432/portfolio
      WORKER_CONSENT_BASE_URL: http://consent-service:8002
      # Ein Volume, kein Pfad im Image: der wäre beim nächsten Deploy weg.
      WORKER_STORAGE_ROOT: /var/lib/workertransfer/portfolio-attachments
    ports:
      - "8005:8005"
    command:
      - uvicorn
      - portfolio_service.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8005"
      - --reload
      - --reload-dir
      - /app/apps/portfolio-service/src
      - --reload-dir
      - /app/packages
    volumes:
      - ./:/app
      - /app/.venv
      - portfolio-attachments:/var/lib/workertransfer/portfolio-attachments
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request;urllib.request.urlopen("http://localhost:8005/health/live")
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 40s

  jobs-service:
    <<: *service
    container_name: workertransfer-jobs
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE_DIR: jobs-service
    environment:
      <<: *service-env
      WORKER_PORT: "8006"
      WORKER_DATABASE_URL: postgresql+asyncpg://worker:worker@postgres:5432/jobs
    ports:
      - "8006:8006"
    command:
      - uvicorn
      - jobs_service.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8006"
      - --reload
      - --reload-dir
      - /app/apps/jobs-service/src
      - --reload-dir
      - /app/packages
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request;urllib.request.urlopen("http://localhost:8006/health/live")
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 40s

  applications-service:
    <<: *service
    container_name: workertransfer-applications
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE_DIR: applications-service
    environment:
      <<: *service-env
      WORKER_PORT: "8007"
      WORKER_DATABASE_URL: postgresql+asyncpg://worker:worker@postgres:5432/applications
      WORKER_CONSENT_BASE_URL: http://consent-service:8002
      WORKER_JOBS_BASE_URL: http://jobs-service:8006
    ports:
      - "8007:8007"
    command:
      - uvicorn
      - applications_service.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8007"
      - --reload
      - --reload-dir
      - /app/apps/applications-service/src
      - --reload-dir
      - /app/packages
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request;urllib.request.urlopen("http://localhost:8007/health/live")
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 40s

  companies-service:
    <<: *service
    container_name: workertransfer-companies
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE_DIR: companies-service
    environment:
      <<: *service-env
      WORKER_PORT: "8008"
      WORKER_DATABASE_URL: postgresql+asyncpg://worker:worker@postgres:5432/companies
    ports:
      - "8008:8008"
    command:
      - uvicorn
      - companies_service.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8008"
      - --reload
      - --reload-dir
      - /app/apps/companies-service/src
      - --reload-dir
      - /app/packages
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request;urllib.request.urlopen("http://localhost:8008/health/live")
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 40s

  transfer-service:
    <<: *service
    container_name: workertransfer-transfer
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE_DIR: transfer-service
    environment:
      <<: *service-env
      WORKER_PORT: "8009"
      WORKER_DATABASE_URL: postgresql+asyncpg://worker:worker@postgres:5432/transfer
      WORKER_CONSENT_BASE_URL: http://consent-service:8002
    ports:
      - "8009:8009"
    command:
      - uvicorn
      - transfer_service.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8009"
      - --reload
      - --reload-dir
      - /app/apps/transfer-service/src
      - --reload-dir
      - /app/packages
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request;urllib.request.urlopen("http://localhost:8009/health/live")
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: workertransfer-web
    restart: unless-stopped
    depends_on:
      identity-service:
        condition: service_healthy
      consent-service:
        condition: service_healthy
      profile-service:
        condition: service_healthy
      resume-service:
        condition: service_healthy
      portfolio-service:
        condition: service_healthy
      jobs-service:
        condition: service_healthy
      applications-service:
        condition: service_healthy
      companies-service:
        condition: service_healthy
      transfer-service:
        condition: service_healthy
    environment:
      # pnpm will purge node_modules when the lockfile changed since the image
      # was built, and without a TTY it aborts instead of asking — der Container
      # startet dann gar nicht. CI=true heißt hier nur "frag nicht nach".
      CI: "true"
      # Read by the browser, so it must be a host-visible URL — the compose
      # service name `identity-service` resolves only inside the network.
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8001}
      VITE_CONSENT_BASE_URL: ${VITE_CONSENT_BASE_URL:-http://localhost:8002}
      VITE_PROFILE_BASE_URL: ${VITE_PROFILE_BASE_URL:-http://localhost:8003}
      VITE_RESUME_BASE_URL: ${VITE_RESUME_BASE_URL:-http://localhost:8004}
      VITE_PORTFOLIO_BASE_URL: ${VITE_PORTFOLIO_BASE_URL:-http://localhost:8005}
      VITE_JOBS_BASE_URL: ${VITE_JOBS_BASE_URL:-http://localhost:8006}
      VITE_APPLICATIONS_BASE_URL: ${VITE_APPLICATIONS_BASE_URL:-http://localhost:8007}
      VITE_COMPANIES_BASE_URL: ${VITE_COMPANIES_BASE_URL:-http://localhost:8008}
      VITE_TRANSFER_BASE_URL: ${VITE_TRANSFER_BASE_URL:-http://localhost:8009}
    ports:
      - "5173:5173"
    volumes:
      - ./:/app
      # Anonymous volumes so the image's installed dependencies survive the bind
      # mount above. Without these the host's node_modules (or its absence)
      # would replace them and Vite would not start.
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/packages/ui/node_modules

volumes:
  portfolio-attachments:
  postgres-data:

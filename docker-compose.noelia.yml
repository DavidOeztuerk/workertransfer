# The Noelia Control Plane that collects this fleet.
#
# AN OVERLAY OF ITS OWN AND NOT IN docker-compose.yml. The product lives in a
# neighbouring repository; the main stack must not depend on it, otherwise
# `make up` fails for everybody who has not checked it out.
#
#   docker compose -f docker-compose.yml -f docker-compose.noelia.yml up -d
#   make control-plane
#
# It only reads. There is no path from here into a service: it fetches
# `/noelia/report.json` and lays the reports side by side.

services:
  noelia-control-plane:
    build:
      context: ${NOELIA_CONTROL_PLANE_PFAD:-../NoeliaControlPlane}
      dockerfile: Dockerfile
    image: noelia-control-plane:local
    container_name: workertransfer-control-plane
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://0.0.0.0:8080"

      # THE SAME PAPER AS THE OPERATIONS DASHBOARD, and no second one: it
      # presents it at exactly the door that checks it. Empty means that every
      # service answers 404 — the fleet would stay empty without anything being
      # broken.
      ControlPlane__OperatorSecret: ${WORKERTRANSFER_EVIDENCE_SECRET:?missing — `make env` writes a .env and rolls it}

      # The licence stands in the environment and not in the fleet file: it is a
      # signed paper naming a customer, and such a thing does not belong in git.
      ControlPlane__Licence: ${WORKERTRANSFER_NOELIA_LICENCE:-}

      # The history belongs on the volume, not in the working directory. The
      # image runs as non-root and may not write in `/app` — the default puts
      # the SQLite file exactly there, though, and the container dies while
      # resolving with "unable to open database file".
      ControlPlane__HistoryPath: /var/lib/noelia-control-plane/verlauf.sqlite
    volumes:
      # The fleet: WHICH services, under which addresses. It belongs here and
      # not in the neighbouring repository — it describes THIS stack, and the
      # addresses are the compose service names.
      #
      # The target name is `appsettings.Development.json` and not a descriptive
      # one: the application loads `appsettings.{ASPNETCORE_ENVIRONMENT}.json`
      # and no other file — an `appsettings.Flotte.json` would lie in the image
      # and never be read, and the fleet would be silently empty. The vendor's
      # demo fleet stands at that path in the image; it has to go anyway,
      # otherwise it collects seven unreachable addresses.
      - ./docker/noelia-control-plane.json:/app/appsettings.Development.json:ro

      # THE SIGNING KEY OUTLIVES THE CONTAINER. An attestation signed with a key
      # that died with the process can afterwards be checked by nobody.
      #
      # The volume and the history file keep their names on purpose: renaming
      # either would start with an empty volume or file, and the signing key
      # and the history in it would be gone.
      - noelia-control-plane-daten:/var/lib/noelia-control-plane
    ports:
      # 8091, right beside the gateway on 8090. Not 8080: that is the port
      # compose and kind have already quarrelled over once, and afterwards
      # nobody could say who answered.
      - "8091:8080"
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  noelia-control-plane-daten:

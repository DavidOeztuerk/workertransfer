# The local cluster. One node is enough: this chart runs every service with
# exactly one replica (see ADR-0028 and values.yaml), so there is nothing to
# distribute. A second node would be waiting time without a statement.
#
# `kind create cluster --config deploy/kind/cluster.yaml`
# — or more simply `make k8s-up`, which creates it along the way.

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: workertransfer

nodes:
  - role: control-plane
    # This is how traffic comes in from outside — without an ingress
    # controller, without a LoadBalancer, without `kubectl port-forward` in a
    # second window. The gateway Service is a NodePort on 30080; this line maps
    # it onto a host port.
    #
    # 8090, the same host port the compose gateway uses — on purpose: the two
    # environments cannot run at the same time anyway (scripts/k8s-up.sh checks
    # the ports before it builds anything and names them), and one address for
    # the API in both is the better trade.
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8090
        protocol: TCP
      # The Mailpit UI, under the same number as with docker compose. The
      # confirmation link from the registration lies there, and an environment
      # in which one can only sign in with a second window full of
      # `kubectl port-forward` does not get used.
      - containerPort: 30825
        hostPort: 8025
      # The UI, on the same host port compose uses. It is a door of its own —
      # the gateway on 8090 serves the API and never a document (ADR-0040).
      - containerPort: 30173
        hostPort: 5173
        protocol: TCP

# The default is the LOCAL staging environment (kind).
#
# For staging and production nothing about this structure changes, only the
# values: `postgres.enabled: false` and a real host, `mailpit.enabled: false`
# and a real SMTP server, `secrets.existingSecret` instead of the development
# values further down, a registry prefix on the image. Exactly the same split
# as with the gateway: what is the same everywhere is a file; what differs is a
# value.

# --- The one image ----------------------------------------------------------
# All services AND the gateway run from THE SAME image. They differ in exactly
# one environment variable, SERVICE_DIR, and that stands in the service list
# below. Fifteen images that differ in one variable would not be fifteen times
# the software — only fifteen times the space.
image:
  repository: workertransfer/service
  tag: dev
  # IfNotPresent, because `kind load docker-image` puts the image into the node
  # and there is no registry it could be pulled from. Always would let every
  # pod run into ImagePullBackOff.
  pullPolicy: IfNotPresent

webImage:
  repository: workertransfer/web
  tag: dev
  pullPolicy: IfNotPresent

# --- Replicas: one, and that is a DECISION ----------------------------------
# Not "not scaled yet", but "may not be scaled yet".
#
# Three reasons stood here. Checking after the migration, ONE remained, one is
# solved, and one turned out to be something other than an obstacle to
# scaling. In order, because the differences count:
#
#   1. SOLVED. The outbox dispatcher takes its rows with
#      "FOR UPDATE SKIP LOCKED" (OutboxDispatcher.cs, raw SQL — LINQ cannot
#      express it). Two dispatchers NO LONGER grab the same rows. In the Python
#      days that was the reason every mail went out twice.
#
#   2. STILL HOLDS. Every service MIGRATES ITS SCHEMA AT STARTUP
#      (ServiceDefaults.SchemaMigration). Two pods are two pilgrims on the same
#      schema — a race nobody wins. In the Python days the migration stood in
#      an initContainer and was therefore per pod as well; it did not get
#      better that way, only less visible.
#
#   3. BACK AGAIN — but at the GATEWAY, not here. The auth brake was missing
#      entirely after the migration. It stands again since D1, and in the
#      gateway, because only there the caller's origin is visible: behind the
#      gateway every service sees only the gateway, and a brake there would
#      have thrown all people into one pot. Its counter runs in-process, so the
#      GATEWAY's 1 hangs on it — see templates/gateway.yaml. This number here
#      applies to the services and is not touched by it.
#
# Whoever raises this number must solve point 2 first: the migration out of
# the startup. Point 1 is done, point 3 applies to another deployment.
replicaCount: 1

# --- Shared environment -----------------------------------------------------
# Corresponds to the x-environment anchor in docker-compose.yml.
env:
  ASPNETCORE_ENVIRONMENT: Staging
  JwtSettings__Issuer: workertransfer
  JwtSettings__Audience: workertransfer
  Mail__Sender: noreply@workertransfer.local
  # Traces to Jaeger. EMPTY would mean OFF.
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317

# The origin under which the BROWSER reaches the API. In the kind cluster that
# is the host port from deploy/kind/cluster.yaml. In staging and production the
# real name stands here.
#
# It is needed at the gateway's door, in CORS and in the UI's runtime
# configuration (web.runtimeConfig), and all of them have to say the same.
publicUrl: http://localhost:8090

# The origin the BROWSER loads the UI from. Separate from publicUrl on purpose:
# the gateway serves the API and nothing else (ADR-0040). Routing document
# requests through it is what this split exists to prevent.
#
# Confirmation mails point here, and CORS names it — without that the UI is
# cross-origin to the gateway and every request fails a preflight.
webUrl: http://localhost:5173

# --- Secrets ----------------------------------------------------------------
# EMPTY means: the chart rolls one and KEEPS it across upgrades (it reads the
# existing Secret back before it creates a new one — otherwise every
# `helm upgrade` would sign out every session).
#
# That is no convenience here but necessary: a secret checked in with the chart
# stands publicly in git, and a chart that set one would ship the same secret
# to every installation.
#
# In production `existingSecret` belongs here: a Secret somebody else manages,
# and the chart only touches it to read it.
secrets:
  existingSecret: ""
  # The token key pair (ECDSA P-256, base64). Both halves belong to ONE pair;
  # rolled separately, neither fits the other.
  jwtPrivateKey: ""
  jwtPublicKey: ""
  # Names the key, so a change allows two side by side.
  jwtKeyId: "k1"
  # Two separate secrets, expressly (ADR-0027 §4.4): "may trigger a mail" and
  # "may erase everything about a person" must not be the same paper.
  notifySecret: ""
  erasureSecret: ""
  # And a THIRD: the door in front of the evidence (ADR-0044). Whoever may
  # trigger a mail need not learn which AI providers this instance uses. EMPTY
  # here means: the door is shut, the report answers 404 — which is the right
  # default in a cluster without the need.
  evidenceSecret: ""

  # The master key. It encrypts a person's AI key AND the data-protection key
  # ring (ADR-0046), so EVERY service needs it — not just identity. Missing, a
  # pod dies at startup naming this variable.
  secretsKey: ""
  # The database is reachable only inside the cluster and has no NodePort. A
  # fixed value keeps `kubectl exec ... psql` simple; whoever wants to change
  # that sets something else here.
  postgresPassword: worker

# The key for the drafting help (ADR-0024). EMPTY means: it is off, and the UI
# says so. It never stands in the repository — for a local run
# WORKERTRANSFER_AI_KEY=... make k8s-up is enough. Mistral (EU) is the
# default provider (VISION-FRAGEN E2); its API is OpenAI-compatible.
aiKey: ""
draftingProvider: openai_compatible
draftingModel: mistral-medium-latest
# WHERE the drafting help calls, and why that stands here and not only as a
# default in the source: the egress boundary derives its allowed hosts from the
# CONFIGURATION (`ServiceFoundation`). A built-in target abroad is exactly what
# a sovereignty report is meant to surface — and without this line the
# boundary refuses the call in the cluster without logging it.
# docker-compose.yml has said the same since the move to `SovereignPlatform`;
# the chart was missing it.
draftingUrl: https://api.mistral.ai/v1/chat/completions

# --- Postgres ---------------------------------------------------------------
# enabled: false in staging/production, then `host` points at the managed
# database. The services notice nothing of it: they only know their connection
# string, and that is assembled from host/user/password.
postgres:
  enabled: true
  image: postgres:17-alpine
  host: postgres
  port: 5432
  user: worker
  storage: 4Gi
  # Only for completeness: the entrypoint creates this one alone, every further
  # service database comes from scripts/initdb (ADR-0004 forbids a shared
  # database).
  bootstrapDatabase: identity

# --- Valkey -----------------------------------------------------------------
# The shared revocation store. enabled: false in staging/production, then
# `host` points at a managed instance.
valkey:
  enabled: true
  image: valkey/valkey:8-alpine
  host: valkey
  port: 6379
  storage: 256Mi

# --- Mailpit ----------------------------------------------------------------
# Catches every mail. Off in production, and smtp.host points outside.
mailpit:
  enabled: true
  image: axllent/mailpit:latest
  # The UI on a host port, as with docker compose (:8025).
  #
  # Without that the confirmation link from the registration would be reachable
  # only via `kubectl port-forward` — and an environment in which one cannot
  # sign in without first opening a second window does not get used.
  #
  # Hangs on `enabled`: if Mailpit is off, there is no port either. In
  # production there is therefore nothing to forget.
  nodePort: 30825

smtp:
  host: mailpit
  port: 1025

# --- Jaeger -----------------------------------------------------------------
# All-in-one instead of collector + Jaeger: the collector pays off with several
# targets. Here there is one, and one link fewer in the chain is one fewer that
# stays silent.
jaeger:
  enabled: true
  image: jaegertracing/all-in-one:1.60.0

# --- Gateway ----------------------------------------------------------------
# No Traefik any more: the gateway is a service of its own from the same image
# (SERVICE_DIR=gateway), and its route map travels WITH the image.
#
# With that the ConfigMap that carried the Traefik file into the cluster is
# gone — and with it the question whether the copy is still right. What compose
# runs runs here.
gateway:
  # The NodePort deploy/kind/cluster.yaml maps onto host port 8090.
  nodePort: 30080
  port: 8090

# --- UI ---------------------------------------------------------------------
web:
  # In the cluster every base URL points at the SAME origin: the gateway's.
  #
  # Empty means: use publicUrl.
  apiOrigin: ""

  # The NodePort deploy/kind/cluster.yaml maps onto host port 5173 — the same
  # port compose uses, so the UI has one address in both environments.
  nodePort: 30173

# --- The services -----------------------------------------------------------
# One list two templates run over (Deployment, Service) — the same principle as
# the x-service anchor in docker-compose.yml. Adding a service is an entry, not
# a copy.
#
#   name      — name of the k8s Service. MUST match the compose service name,
#               because ocelot.json addresses exactly these names.
#   dir       — the key in the image, set as SERVICE_DIR
#   port      — port the service listens on
#   database  — its own database (ADR-0004: no shared one)
#   env       — what only this service needs
services:
  - name: identity-service
    dir: identity
    port: 8001
    database: identity
    env:
      # Where the erasure commands go (ADR-0027 §4). jobs-service stands among
      # them but is NO recipient of the cascade — it only gets the intent from
      # §7 when a company is left without an administrator.
      Erasure__BaseUrls__consent: http://consent-service:8002
      Erasure__BaseUrls__profile: http://profile-service:8003
      Erasure__BaseUrls__resume: http://resume-service:8004
      Erasure__BaseUrls__portfolio: http://portfolio-service:8005
      Erasure__BaseUrls__jobs: http://jobs-service:8006
      Erasure__BaseUrls__applications: http://applications-service:8007
      Erasure__BaseUrls__transfer: http://transfer-service:8009
      Erasure__BaseUrls__notification: http://notification-service:8010
      Erasure__BaseUrls__github: http://github-service:8011
      Erasure__BaseUrls__scout: http://scout-service:8012
      Erasure__BaseUrls__advisor: http://advisor-service:8013
      Erasure__BaseUrls__assessment: http://assessment-service:8014
      Erasure__BaseUrls__messages: http://messages-service:8015

  - name: consent-service
    dir: consent
    port: 8002
    database: consent

  - name: profile-service
    dir: profile
    port: 8003
    database: profile
    env:
      # Asks the ledger before it shows a foreign profile (ADR-0013,
      # synchronous and without a cache).
      Consent__BaseUrl: http://consent-service:8002
    drafting: true

  - name: resume-service
    dir: resume
    port: 8004
    database: resume
    env:
      # The CV request is a first contact: at least a `recruiter` (ADR-0048).
      # `Identity__Secret` hangs on this line in _helpers.tpl.
      Identity__BaseUrl: http://identity-service:8001
      Consent__BaseUrl: http://consent-service:8002
      Notifications__BaseUrl: http://notification-service:8010
      DocumentStore__Folder: /data/document-store
    # Same reason as portfolio: without a volume the files are gone at the next
    # pod, while the rows in Postgres still stand (ADR-0035).
    persistence:
      size: 2Gi
      mountPath: /data/document-store

  - name: portfolio-service
    dir: portfolio
    port: 8005
    database: portfolio
    env:
      Consent__BaseUrl: http://consent-service:8002
      Storage__Root: /var/lib/workertransfer/portfolio-attachments
    # Attachments outlive the pod. A path in the image would be gone at the
    # next deploy — the same consideration as the volume in docker-compose.yml.
    persistence:
      size: 2Gi
      mountPath: /var/lib/workertransfer/portfolio-attachments

  - name: jobs-service
    dir: jobs
    port: 8006
    database: jobs
    drafting: true
    env:
      # The role lookup: who is `admin` stands in identity-service's membership
      # table and not in the token. `Identity__Secret` hangs on this line in
      # _helpers.tpl.
      Identity__BaseUrl: http://identity-service:8001

  - name: applications-service
    dir: applications
    port: 8007
    database: applications
    env:
      Consent__BaseUrl: http://consent-service:8002
      Jobs__BaseUrl: http://jobs-service:8006
      Notifications__BaseUrl: http://notification-service:8010
      Identity__BaseUrl: http://identity-service:8001
      # The cover letter's own details, fetched on the server. Missing here
      # until 07.10.2026 — in the cluster the cover letter never had its
      # context, and without `drafting` no platform model either.
      Lookup__Identity: http://identity-service:8001
      Lookup__Profile: http://profile-service:8003
      Lookup__Resume: http://resume-service:8004
      Lookup__Companies: http://companies-service:8008
    drafting: true

  - name: companies-service
    dir: companies
    port: 8008
    database: companies
    env:
      Identity__BaseUrl: http://identity-service:8001

  - name: transfer-service
    dir: transfer
    port: 8009
    database: transfer
    env:
      Consent__BaseUrl: http://consent-service:8002
      Notifications__BaseUrl: http://notification-service:8010
      Identity__BaseUrl: http://identity-service:8001

  - name: notification-service
    dir: notification
    port: 8010
    database: notification
    env:
      # This service decides WHETHER something goes out; TO WHOM only
      # identity-service knows. Only a userId crosses the boundary.
      Identity__BaseUrl: http://identity-service:8001

  - name: github-service
    dir: github
    port: 8011
    database: github
    env:
      Consent__BaseUrl: http://consent-service:8002
      # The two outside targets. The egress boundary allows only hosts that
      # stand in the configuration; a default in the source does not count.
      GitHub__BaseUrl: https://api.github.com
      GitHub__OAuth__AuthorizeUrl: https://github.com

  - name: scout-service
    dir: scout
    port: 8012
    database: scout
    drafting: true
    env:
      # Every target of this service stands here, and because it HAS to stand
      # here: the egress boundary derives its allowed hosts from the
      # configuration. A target that stands only in the source is refused —
      # without a log line.
      Consent__BaseUrl: http://consent-service:8002
      # The internal door through which the search goes. `Profile__Secret`
      # hangs on this line in _helpers.tpl.
      Profile__BaseUrl: http://profile-service:8003
      # The evidence — github-service, NOT github.com: this service never asks
      # GitHub itself.
      GitHub__BaseUrl: http://github-service:8011
      # The advert for the reachability tick (ADR-0041).
      Jobs__BaseUrl: http://jobs-service:8006
      # "Your profile was discovered" (ADR-0033), via the outbox.
      Notifications__BaseUrl: http://notification-service:8010

  - name: advisor-service
    dir: advisor
    port: 8013
    database: advisor
    env:
      # Every target of this service stands here, and because it HAS to stand
      # here: the egress boundary derives its allowed hosts from the
      # configuration. A target that stands only in the source is refused —
      # without a log line.
      #
      # The ledger carries the STAGE of a conversation (ADR-0037): read at every
      # request, written at every release. There is no stage column of its own,
      # so this line is not optional.
      Consent__BaseUrl: http://consent-service:8002
      # identity-service's internal doors: a company's domain (so an exclusion
      # can take effect) and a person's civil name (only from stage 3, and only
      # AFTER the ledger has confirmed it). `Identity__Secret` hangs on this
      # line in _helpers.tpl.
      Identity__BaseUrl: http://identity-service:8001
      # The handover of the agreement. The triangle consensus stands THERE.
      Transfer__BaseUrl: http://transfer-service:8009
      # "A company has opened a conversation", via the outbox.
      Notifications__BaseUrl: http://notification-service:8010

  - name: assessment-service
    dir: assessment
    port: 8014
    database: assessment
    env:
      # Every target of this service stands here, and because it HAS to stand
      # here: the egress boundary derives its allowed hosts from the
      # configuration. A target that stands only in the source is refused —
      # without a log line.
      #
      # The ledger, and it is this service's ONLY guard: a work sample stands on
      # `profile.visibility:*` and on no capability of its own (ADR-0042).
      # Without this line the company side answers 503; the person side keeps
      # answering, because whoever wants to read their evaluation needs no
      # ledger for it.
      Consent__BaseUrl: http://consent-service:8002
      # "Something has moved on your work sample", via the outbox, free of
      # content (ADR-0025).
      Notifications__BaseUrl: http://notification-service:8010

  - name: messages-service
    dir: messages
    port: 8015
    database: messages
    env:
      # One conversation per process (ADR-0047): who belongs to it is asked of
      # applications-service with the caller's token, at every request.
      Applications__BaseUrl: http://applications-service:8007
      # An approach stands on the ledger, asked at every request (ADR-0013).
      Consent__BaseUrl: http://consent-service:8002
      # The AI advisor's sources: her mandate and her notice period (ADR-0049).
      OwnFacts__AdvisorUrl: http://advisor-service:8013
      OwnFacts__TransferUrl: http://transfer-service:8009
      # Members and a person's own AI access. `Identity__Secret` hangs on this
      # line in _helpers.tpl.
      Identity__BaseUrl: http://identity-service:8001
      Notifications__BaseUrl: http://notification-service:8010
    drafting: true
      # NOT entered: the address a person submits. It is stored and shown,
      # never fetched.

resources:
  requests:
    cpu: 25m
    memory: 128Mi
  # No CPU limit: a throttled process answers more slowly instead of failing,
  # and in a readiness check that looks like a broken service. Memory is
  # limited, because a leak would otherwise take the node along.
  limits:
    memory: 768Mi

apiVersion: v2
name: workertransfer
description: >-
  The services, the gateway and the UI as one release. Locally against kind,
  in staging and production with a different values.yaml — not with a
  different structure.
type: application

# The chart's version. Goes up when the templates change.
version: 0.1.0

# The software it ships. No fixed value, because the repository assigns no
# release numbers; `appVersion` follows the image tag from values.yaml.
appVersion: "dev"

kubeVersion: ">=1.29.0-0"

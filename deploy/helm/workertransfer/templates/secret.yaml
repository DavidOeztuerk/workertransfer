{{- if not .Values.secrets.existingSecret }}
{{/*
Secrets the chart holds itself.

The `lookup` is the point: it reads the Secret back from the cluster if it
already exists. Without it EVERY `helm upgrade` would roll new values — and a
new secret signs out every open session at that moment. An upgrade that throws
people out is no upgrade.

With `helm template` and `--dry-run`, `lookup` always returns nothing (there is
no cluster one could ask). The values rendered there are therefore throwaway
values — that is right, they are never applied.
*/}}
{{- $name := printf "%s-secrets" .Release.Name }}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name) }}
{{- $oldData := dict }}
{{- if $old }}{{ $oldData = $old.data }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "workertransfer.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{/*
  The key pair is NOT rolled but demanded: `keepOrMake` generates both halves
  independently, and two independently rolled halves do not fit together —
  every token would be invalid, and the error would look like a broken
  sign-in. `scripts/k8s-up.sh` generates the pair.
  */}}
  WORKER_JWT_PRIVATE_KEY: {{ required "secrets.jwtPrivateKey is missing — `openssl ecparam -name prime256v1 -genkey -noout | openssl pkcs8 -topk8 -nocrypt -outform DER | base64`" .Values.secrets.jwtPrivateKey | quote }}
  WORKER_JWT_PUBLIC_KEY: {{ required "secrets.jwtPublicKey is missing — the public half of the same pair" .Values.secrets.jwtPublicKey | quote }}
  {{/*
  Secret and hash are demanded as well, for the same reason (ADR-0057): sprig
  has `sha256sum` only as hex and Noelia reads base64url, so the chart cannot
  derive one from the other. `scripts/k8s-up.sh` makes the pairs.
  */}}
  {{- range $client, $pair := .Values.secrets.m2m }}
  {{ printf "WORKER_M2M_%s_SECRET" (upper $client) }}: {{ required (printf "secrets.m2m.%s.secret is missing — scripts/k8s-up.sh makes the pair" $client) $pair.secret | quote }}
  {{ printf "WORKER_M2M_%s_SECRET_HASH" (upper $client) }}: {{ required (printf "secrets.m2m.%s.hash is missing — the hash of the same pair" $client) $pair.hash | quote }}
  {{- end }}
  WORKER_ERASURE_SECRET: {{ include "workertransfer.keepOrMake" (dict "data" $oldData "key" "WORKER_ERASURE_SECRET" "wanted" .Values.secrets.erasureSecret) | quote }}
  WORKER_SECRETS_KEY: {{ include "workertransfer.keepOrMake" (dict "data" $oldData "key" "WORKER_SECRETS_KEY" "wanted" .Values.secrets.secretsKey) | quote }}
  {{/*
  Only for the image, on an empty volume: scripts/initdb ends it in the same run
  (ADR-0058).
  */}}
  POSTGRES_PASSWORD: {{ include "workertransfer.keepOrMake" (dict "data" $oldData "key" "POSTGRES_PASSWORD" "wanted" "") | quote }}
  {{/*
  What each service holds alone (ADR-0058). The other half of a database password
  is the role in the volume: after `helm uninstall` new values meet an old PVC,
  and the services do not get in until the script ran (scripts/k8s-up.sh says so).
  */}}
  {{- range .Values.services }}
  {{- $name := upper .database }}
  {{ printf "WORKER_DB_PASSWORD_%s" $name }}: {{ include "workertransfer.keepOrMake" (dict "data" $oldData "key" (printf "WORKER_DB_PASSWORD_%s" $name) "wanted" "") | quote }}
  {{ printf "WORKER_KEYRING_KEY_%s" $name }}: {{ include "workertransfer.keepOrMake" (dict "data" $oldData "key" (printf "WORKER_KEYRING_KEY_%s" $name) "wanted" "") | quote }}
  {{ printf "WORKER_EVIDENCE_SECRET_%s" $name }}: {{ include "workertransfer.keepOrMake" (dict "data" $oldData "key" (printf "WORKER_EVIDENCE_SECRET_%s" $name) "wanted" "") | quote }}
  {{- end }}
  {{/*
  Empty is a valid value and means OFF. It stands in the Secret all the same and
  not in the ConfigMap: a key that is set once should not be read along at the
  next `kubectl get configmap`.
  */}}
  WORKER_AI_KEY: {{ .Values.aiKey | quote }}
{{- end }}

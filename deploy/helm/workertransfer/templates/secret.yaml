{{- if not .Values.secrets.existingSecret }}
{{/*
Geheimnisse, die das Chart selbst hält.

Der `lookup` ist der Punkt: er liest das Secret aus dem Cluster zurück, falls es
schon existiert. Ohne ihn würfelte JEDES `helm upgrade` neue Werte — und ein
neues WORKER_JWT_SECRET meldet in dem Moment jede offene Sitzung ab. Ein
Upgrade, das Menschen auswirft, ist kein Upgrade.

Beim `helm template` und `--dry-run` gibt `lookup` immer nichts zurück (es gibt
keinen Cluster, den man fragen könnte). Die dort gerenderten Werte sind deshalb
Wegwerfwerte — das ist richtig so, sie werden nie angewendet.
*/}}
{{- $name := printf "%s-secrets" .Release.Name }}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name) }}
{{- $oldData := dict }}
{{- if $old }}{{ $oldData = $old.data }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "workertransfer.labels" . | nindent 4 }}
type: Opaque
stringData:
  WORKER_JWT_SECRET: {{ include "workertransfer.keepOrMake" (dict "data" $oldData "key" "WORKER_JWT_SECRET" "wanted" .Values.secrets.jwtSecret) | quote }}
  WORKER_NOTIFY_SECRET: {{ include "workertransfer.keepOrMake" (dict "data" $oldData "key" "WORKER_NOTIFY_SECRET" "wanted" .Values.secrets.notifySecret) | quote }}
  WORKER_ERASURE_SECRET: {{ include "workertransfer.keepOrMake" (dict "data" $oldData "key" "WORKER_ERASURE_SECRET" "wanted" .Values.secrets.erasureSecret) | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  {{/*
  Leer ist ein gültiger Wert und heisst AUS. Er steht trotzdem im Secret und
  nicht in der ConfigMap: ein Schlüssel, der einmal gesetzt wird, soll nicht
  beim nächsten `kubectl get configmap` mitgelesen werden.
  */}}
  WORKER_ANTHROPIC_API_KEY: {{ .Values.anthropicApiKey | quote }}
{{- end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    {{- include "workertransfer.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "workertransfer.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap-web.yaml") . | sha256sum }}
    spec:
      containers:
        - name: web
          image: "{{ .Values.webImage.repository }}:{{ .Values.webImage.tag }}"
          imagePullPolicy: {{ .Values.webImage.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          env:
            {{/*
            The Content-Security-Policy names the API's origin in connect-src
            (docker/web-nginx.conf.template). The same origin config.js
            points at — two values here would be the one that drifts.
            */}}
            - name: WT_API_ORIGIN
              value: {{ include "workertransfer.apiOrigin" . | quote }}
          volumeMounts:
            {{/*
            subPath, so only this one file is replaced and not the whole
            directory with index.html and the bundles in it.
            */}}
            - name: config
              mountPath: /usr/share/nginx/html/config.js
              subPath: config.js
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-web-config
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    {{- include "workertransfer.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  {{/*
  NodePort and not ClusterIP: the UI needs a door of its own. The alternative
  — letting the gateway answer document requests — is what ADR-0040 removed.
  */}}
  type: NodePort
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: web
  ports:
    {{/*
    Port 5173, although nginx listens on 80: it is the same port compose uses
    for the UI, so the UI has one address in both environments. The difference
    is resolved here, not in the image.
    */}}
    - name: http
      port: 5173
      targetPort: http
      nodePort: {{ .Values.web.nodePort }}

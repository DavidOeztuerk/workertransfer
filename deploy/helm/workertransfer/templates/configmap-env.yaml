{{/*
Was alle elf Dienste gleich haben — das Gegenstück zum x-umgebung-Anker in
docker-compose.yml. Geheimnisse stehen NICHT hier, sondern im Secret.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-env
  labels:
    {{- include "workertransfer.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  Mail__Host: {{ .Values.smtp.host | quote }}
  Mail__Port: {{ .Values.smtp.port | quote }}
  {{/*
  Die Basis für Bestätigungslinks — das muss sein, was der BROWSER erreicht,
  nicht ein clusterinterner Servicename. Eine Mail mit http://identity-service
  darin führt niemanden irgendwohin.
  */}}
  Mail__WebAdresse: {{ .Values.webUrl | quote }}
  {{/*
  Who may call from a browser. Without this key Noelia falls back to
  localhost:3000 in Development — an origin that does not exist here — and
  every preflight comes back 204 without a single Access-Control-Allow-*
  header: CORS wired in, letting nobody through.

  It only matters because the UI has a door of its own. While the gateway
  served the UI too, everything was same-origin and the gap stayed invisible.
  */}}
  CORS_ORIGINS: {{ printf "%s,%s" .Values.webUrl .Values.publicUrl | quote }}

{{/*
The UI — as a BUILT artefact, not as the Vite dev server. That is the
difference to docker compose and the reason this environment may be called
"staging": what is checked is what is shipped.

That costs a small thing that determines the structure: `vite build` bakes
import.meta.env.VITE_* into the bundle. An image with baked-in URLs CANNOT be
the same in two environments — the promise "only a different values.yaml"
would be broken for the frontend, and invisibly so.

That is why web/src/env.ts reads window.__WT_CONFIG__ first (see
web/public/config.js) and VITE_* only after that. This ConfigMap is the real
version of that file; in the pod it is laid over the one from the image.
*/}}
{{- $origin := include "workertransfer.apiOrigin" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-web-config
  labels:
    {{- include "workertransfer.labels" . | nindent 4 }}
data:
  config.js: |
    // Generated by the Helm chart. In the cluster all thirteen base URLs point
    // at the SAME origin: the gateway's. One API origin instead of thirteen
    // ports means no cookie confusion between ports.
    window.__WT_CONFIG__ = {
      API_BASE_URL: {{ $origin | quote }},
      CONSENT_BASE_URL: {{ $origin | quote }},
      PROFILE_BASE_URL: {{ $origin | quote }},
      RESUME_BASE_URL: {{ $origin | quote }},
      PORTFOLIO_BASE_URL: {{ $origin | quote }},
      JOBS_BASE_URL: {{ $origin | quote }},
      APPLICATIONS_BASE_URL: {{ $origin | quote }},
      COMPANIES_BASE_URL: {{ $origin | quote }},
      TRANSFER_BASE_URL: {{ $origin | quote }},
      GITHUB_BASE_URL: {{ $origin | quote }},
      SCOUT_BASE_URL: {{ $origin | quote }},
      ADVISOR_BASE_URL: {{ $origin | quote }},
      ASSESSMENT_BASE_URL: {{ $origin | quote }},
      MESSAGES_BASE_URL: {{ $origin | quote }},
      // Files from Google Drive and Dropbox (ADR-0054); empty means no button.
      GOOGLE_PICKER_CLIENT_ID: {{ .Values.web.googlePicker.clientId | quote }},
      GOOGLE_PICKER_API_KEY: {{ .Values.web.googlePicker.apiKey | quote }},
      GOOGLE_PICKER_APP_ID: {{ .Values.web.googlePicker.appId | quote }},
      DROPBOX_APP_KEY: {{ .Values.web.dropboxAppKey | quote }}
    };

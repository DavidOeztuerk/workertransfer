{{- if .Values.postgres.enabled }}
{{/*
A database in the cluster — for the local staging environment. In staging and
production `postgres.enabled: false` stands here and `postgres.host` points at
the managed instance. The services notice nothing of it: they only know their
connection string, and that is assembled in _helpers.tpl.

StatefulSet and not Deployment: the pod's name stays the same, and the volume
belongs to it — with a Deployment with a PVC the old pod may still hang on it
at a restart.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-postgres-initdb
  labels:
    {{- include "workertransfer.labels" . | nindent 4 }}
data:
  {{/*
  Comes via --set-file from scripts/initdb/01-service-roles.sh — the same file
  docker compose reads. One source, not two. The key has to end in `.sh`, or the
  entrypoint hands bash to psql.

  `required` instead of a silent fallback: an empty initdb step would only
  stand out nine services later, with "password authentication failed" going
  round in circles.
  */}}
  01-service-roles.sh: |
    {{- required "postgres.initScript is missing — install with `--set-file postgres.initScript=scripts/initdb/01-service-roles.sh` (scripts/k8s-up.sh does that)." .Values.postgres.initScript | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.postgres.host }}
  labels:
    {{- include "workertransfer.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: {{ .Values.postgres.port }}
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    {{- include "workertransfer.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ .Values.postgres.host }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "workertransfer.labels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "workertransfer.secretName" . }}
                  key: POSTGRES_PASSWORD
            {{/*
            The entrypoint creates only this one; every further service
            database comes from initdb (ADR-0004 forbids a shared database).
            */}}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.bootstrapDatabase | quote }}
            {{/*
            Without this the image puts its data directory straight into the
            mount point — and with some storage classes a `lost+found` already
            lies there, whereupon initdb refuses service with "directory not
            empty".
            */}}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            {{/*
            The script sets these on the roles. Whoever is superuser in this pod
            reaches everything anyway, so all of them here widen nothing.
            */}}
            {{- range .Values.services }}
            - name: {{ printf "WORKERTRANSFER_DB_PASSWORD_%s" (upper .database) }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "workertransfer.secretName" $ }}
                  key: {{ printf "WORKER_DB_PASSWORD_%s" (upper .database) }}
            {{- end }}
          ports:
            - name: postgres
              containerPort: {{ .Values.postgres.port }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          {{/*
          timeoutSeconds: the default of 1s is not enough when all services
          start at once — measured: `pg_isready ... timed out after 1s`. If the
          database's readiness flaps, EVERY service briefly loses its route to
          it.

          `postgres` and not the bootstrap database: that one belongs to a role,
          and the superuser enters no database a role owns (ADR-0058).
          */}}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}, "-d", "postgres"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}, "-d", "postgres"]
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        {{/*
        Executable, or the entrypoint sources the script instead of running it.
        */}}
        - name: initdb
          configMap:
            name: {{ .Release.Name }}-postgres-initdb
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
{{- end }}

{{- if .Values.postgres.enabled }}
{{/*
Eine Datenbank im Cluster — für die lokale Staging-Umgebung. In Staging und
Produktion steht hier `postgres.enabled: false` und `postgres.host` zeigt auf
die verwaltete Instanz. Die Dienste merken davon nichts: sie kennen nur ihre
WORKER_DATABASE_URL, und die wird in _helpers.tpl zusammengesetzt.

StatefulSet und nicht Deployment: der Name des Pods bleibt gleich, und das
Volume gehört ihm — bei einem Deployment mit PVC hängt beim Neustart unter
Umständen noch der alte Pod daran.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-postgres-initdb
  labels:
    {{- include "workertransfer.labels" . | nindent 4 }}
data:
  {{/*
  Kommt per --set-file aus scripts/initdb/01-create-service-databases.sql —
  derselben Datei, die docker compose einliest. Eine Quelle, nicht zwei.

  `required` statt eines stillen Rückfalls: ein leerer initdb-Schritt fiele
  erst neun Diensten später auf, mit "database ... does not exist" im
  Kreisverkehr.
  */}}
  01-create-service-databases.sql: |
    {{- required "postgres.initSql fehlt — mit `--set-file postgres.initSql=scripts/initdb/01-create-service-databases.sql` installieren (scripts/k8s-up.sh macht das)." .Values.postgres.initSql | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.postgres.host }}
  labels:
    {{- include "workertransfer.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: {{ .Values.postgres.port }}
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    {{- include "workertransfer.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ .Values.postgres.host }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "workertransfer.labels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "workertransfer.secretName" . }}
                  key: POSTGRES_PASSWORD
            {{/*
            Der Entrypoint legt nur diese eine an; jede weitere Dienstdatenbank
            kommt aus initdb (ADR-0004 verbietet eine gemeinsame Datenbank).
            */}}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.bootstrapDatabase | quote }}
            {{/*
            Ohne das legt das Image sein Datenverzeichnis direkt in den
            Einhängepunkt — und dort liegt bei manchen Speicherklassen schon
            ein `lost+found`, woraufhin initdb den Dienst mit "directory not
            empty" verweigert.
            */}}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: {{ .Values.postgres.port }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          {{/*
          timeoutSeconds: die Voreinstellung 1s reicht nicht, wenn zehn Dienste
          gleichzeitig hochfahren — gemessen: `pg_isready ... timed out after
          1s`. Flattert die Bereitschaft der Datenbank, verliert JEDER Dienst
          kurz seine Route dorthin.
          */}}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}, "-d", {{ .Values.postgres.bootstrapDatabase | quote }}]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}]
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: initdb
          configMap:
            name: {{ .Release.Name }}-postgres-initdb
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
{{- end }}

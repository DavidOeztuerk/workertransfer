{{/*
The gateway — the same service as the others, only with SERVICE_DIR=gateway.

In the Python days Traefik stood here with a ConfigMap that carried
`docker/traefik/dynamic.yml` into the cluster. Both are gone: the route map now
travels IN THE IMAGE (`ocelot.json`), and with that what compose runs runs
here. A copy that goes wrong at the first new path no longer exists.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    {{- include "workertransfer.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  # ONE, and since the brake that is no side issue any more.
  #
  # The auth brake's counter (Noelia's DistributedRateLimiting) runs IN THE
  # PROCESS. With two gateways each has its own window, the effective limit
  # doubles, and nobody sees it — every instance counts correctly for itself.
  #
  # Whoever raises this must share the counter first: the store hangs behind
  # IDistributedRateLimitStore, and RedisDistributedRateLimitStore satisfies
  # the same interface. That is a registration change in Program.cs, no
  # rebuild — but it has to have happened before this number goes up.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        {{- include "workertransfer.labels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
    spec:
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: SERVICE_DIR
              value: gateway
            - name: ASPNETCORE_URLS
              value: {{ printf "http://0.0.0.0:%v" .Values.gateway.port | quote }}
            - name: ASPNETCORE_ENVIRONMENT
              value: {{ .Values.env.ASPNETCORE_ENVIRONMENT | quote }}
          ports:
            - name: web
              containerPort: {{ .Values.gateway.port }}
          {{/*
          The gateway answers its probes ITSELF and does not pass them on.
          Otherwise a single sick service would tip it out of the load
          balancer and take all the others with it.
          */}}
          livenessProbe:
            httpGet:
              path: /health/live
              port: web
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: web
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    {{- include "workertransfer.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  {{/*
  NodePort, so deploy/kind/cluster.yaml maps it onto host port 8090 — the same
  port compose uses; deploy/kind/cluster.yaml says why.
  */}}
  type: NodePort
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: gateway
  ports:
    - name: web
      port: {{ .Values.gateway.port }}
      targetPort: web
      nodePort: {{ .Values.gateway.nodePort }}

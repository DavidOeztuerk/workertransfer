{{/*
Deployment + Service per service, generated from the list in values.yaml.

The Service object's name is NOT free to choose: the gateway's route map
addresses `http://identity-service:8001`, and it travels along in the image. If
the object is called differently here, the map points into the void — and
silently, because Ocelot reports an unreachable neighbour only at the first
call.
*/}}
{{- $root := . }}
{{- range $svc := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $svc.name }}
  labels:
    {{- include "workertransfer.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $svc.name }}
spec:
  replicas: {{ $root.Values.replicaCount }}
  {{/*
  Recreate, not RollingUpdate. Two reasons, and both hang on replicas=1: a
  rolling update would briefly put a SECOND instance beside it — exactly what
  the schema migration at startup does not tolerate (see values.yaml) — and
  with portfolio-service and resume-service the second pod could not get the
  ReadWriteOnce volume at all and would hang.
  */}}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $root.Release.Name }}
      app.kubernetes.io/component: {{ $svc.name }}
  template:
    metadata:
      labels:
        {{- include "workertransfer.labels" $root | nindent 8 }}
        app.kubernetes.io/component: {{ $svc.name }}
      annotations:
        {{/*
        Without this checksum a pod would stay with the OLD values after a
        change to the shared environment — `helm upgrade` would report
        success, and nothing would have changed.
        */}}
        checksum/env: {{ include (print $root.Template.BasePath "/configmap-env.yaml") $root | sha256sum }}
    spec:
      {{/*
      NO initContainer any more, and that is the visible difference to the
      Python days: there a container of its own migrated the schema and called
      `docker/entrypoint.sh` with `true` for it.

      Now the service migrates itself at startup
      (ServiceDefaults.SchemaMigration). The reason is not taste: `dotnet ef`
      needs the SDK, and a runtime image has none. A migration bundle would
      have been the other way and would have introduced a second artefact that
      ages with the image.

      So the waiting stands in the service too — which is right anyway: there
      is no `depends_on` here, the container starts when it likes. The old
      initContainer waited for Postgres in a loop; the same patience now lies
      in `SchemaMigration`, which retries transient failures for a minute.

      CAREFUL with replicas > 1: then two pods migrate the same schema. See
      values.yaml — the number does not stand at 1 by chance.
      */}}
      {{- if $svc.persistence }}
      {{/*
      Named volumes and PVCs come in as root. fsGroup makes the mount
      writable for uid 10001 without the process staying root. Compose
      has no fsGroup — there the entrypoint chowns and drops.
      */}}
      securityContext:
        fsGroup: 10001
        runAsUser: 10001
        runAsNonRoot: true
      {{- end }}
      containers:
        - name: service
          image: "{{ $root.Values.image.repository }}:{{ $root.Values.image.tag }}"
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          {{/*
          NO `command`: the image's ENTRYPOINT stays and reads `SERVICE_DIR`
          from the environment. In the Python days a uvicorn call stood here
          that bypassed the entrypoint — because that would otherwise have
          migrated a second time. Both are gone, and with them the question
          whether the two descriptions of the same start still agree.
          */}}
          envFrom:
            - configMapRef:
                name: {{ $root.Release.Name }}-env
          env:
            {{- include "workertransfer.serviceEnv" (dict "root" $root "svc" $svc) | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
          {{/*
          live says "the process is alive", ready says "the database answers
          too". Swapping them would mean: at a short database disruption the
          service is RESTARTED instead of taken out of traffic — and starts
          right into the same disruption.
          */}}
          {{/*
          timeoutSeconds stands EVERYWHERE, because the default is 1 second —
          and that is wrong here. Measured, not assumed: at the first roll-out
          fifteen pods started at once on one node, and every single error
          message read "timed out after 1s". Three services were restarted
          because of it although they were running.

          A readiness check that asks the database has not reliably answered
          within one second — not because something is broken, but because
          all processes start at once. Whoever "solves" that via the time
          limit writes a defect down as normal behaviour; whoever leaves it
          too tight restarts healthy services.
          */}}
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 40
          resources:
            {{- toYaml $root.Values.resources | nindent 12 }}
          {{- if $svc.persistence }}
          volumeMounts:
            - name: data
              mountPath: {{ $svc.persistence.mountPath }}
          {{- end }}
      {{- if $svc.persistence }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $svc.name }}-data
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $svc.name }}
  labels:
    {{- include "workertransfer.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $svc.name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/component: {{ $svc.name }}
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: http
{{- if $svc.persistence }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $svc.name }}-data
  labels:
    {{- include "workertransfer.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $svc.name }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ $svc.persistence.size }}
{{- end }}
{{- end }}

# Ein Hotfix zurück nach develop — der einzige Weg, auf dem main überhaupt noch
# vor develop geraten kann.
#
# WOZU: der Fluss ist `feature → develop → main`. Ein Hotfix bricht ihn
# bewusst: er zweigt von main ab, wird auf main gemergt und kommt nie über
# develop. Ohne Rückweg steht die Korrektur danach in der Produktion, aber
# nicht in der Entwicklung — der nächste PR `develop → main` würde sie
# überschreiben wollen und kann darüber in Konflikt geraten.
#
# WARUM NUR HOTFIXES: bis 08.08.2026 hörte dieser Lauf auf JEDEN Push nach
# main. Damals stimmte das, weil Dependabot seine PRs gegen den Default-Branch
# öffnete und develop dadurch 21 Commits zurückfiel. Seit `dependabot.yml`
# gelöscht ist, bekommt main nur noch Merges AUS develop — und die brauchen
# keinen Rückweg, weil develop den Inhalt bereits hat. Übrig bleibt genau der
# Hotfix-Fall, und darauf zielt der Auslöser jetzt.
#
# WARUM NUR FAST-FORWARD DIREKT GESCHOBEN WIRD: kann develop vorgespult
# werden, ist es hinterher **byteweise identisch mit main** — und main hat die
# CI bereits bestanden. Es entsteht kein Zustand, den niemand geprüft hat.
#
# Beim Hotfix ist das eher die Ausnahme: läuft auf develop parallel Arbeit,
# sind beide Zweige auseinandergelaufen, und es braucht einen Merge-Commit.
# Der ist von keiner CI geprüft, deshalb wird er NICHT nach develop geschoben,
# sondern auf einem eigenen Zweig vorbereitet (siehe unten). Der Rückfall ist
# hier also der Normalfall, nicht die Notlösung.
#
# KEINE SCHLEIFE: der Push geht auf `develop`, der Auslöser hört auf
# geschlossene PRs nach `main`. Zudem lösen Pushes mit dem GITHUB_TOKEN
# grundsätzlich keine weiteren Läufe aus.

name: Hotfix zurück nach develop

on:
  # Nicht `push`, sondern der geschlossene PR: nur so ist erkennbar, WOHER der
  # Commit kam. Ein Push nach main sieht bei einem Hotfix genauso aus wie bei
  # einem Release aus develop.
  pull_request:
    types: [closed]
    branches: [main]
  # Von Hand anstoßbar — etwa wenn ein Hotfix ausnahmsweise ohne PR auf main
  # landete oder der Rückweg nachgeholt werden muss.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Zwei gleichzeitige Rückführungen würden sich gegenseitig überholen.
# `cancel-in-progress: false`: der laufende darf fertig werden — ein
# abgebrochener Push hinterlässt sonst genau die Lücke, die dieser Lauf
# schließen soll.
concurrency:
  group: rueckfuehrung-main-develop
  cancel-in-progress: false

jobs:
  rueckfuehrung:
    # Nur ein WIRKLICH GEMERGTER Hotfix-PR — ein geschlossener PR ist nicht
    # zwingend ein gemergter, und ein Release aus develop braucht keinen
    # Rückweg.
    #
    # Die Namenskonvention `hotfix/…` ist damit tragend und nicht Kosmetik:
    # heißt der Zweig anders, läuft die Rückführung nicht, und die Korrektur
    # bleibt in develop aus.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'hotfix/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Die ganze Historie: ohne sie kennt der Lauf die gemeinsamen
          # Vorfahren nicht und kann Fast-Forward nicht von Merge trennen.
          fetch-depth: 0

      - name: Git-Identität setzen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: develop nachziehen
        id: nachziehen
        run: |
          set -euo pipefail
          git fetch origin main develop

          if git merge-base --is-ancestor origin/main origin/develop; then
            echo "develop enthält main bereits — nichts zu tun."
            echo "ergebnis=nichts" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git checkout -B develop origin/develop
          if git merge --ff-only origin/main; then
            git push origin develop
            echo "develop auf $(git rev-parse --short HEAD) vorgespult."
            echo "ergebnis=vorgespult" >> "$GITHUB_OUTPUT"
          else
            echo "Kein Fast-Forward möglich — develop trägt eigene Commits."
            echo "ergebnis=pr" >> "$GITHUB_OUTPUT"
          fi

      # Kein Fast-Forward möglich: der Merge wird auf einem EIGENEN Zweig
      # vorbereitet, nicht nach develop geschoben.
      #
      # Warum kein `gh pr create`: GitHub verbietet Actions das Anlegen von
      # PRs, solange „Allow GitHub Actions to create and approve pull
      # requests" in den Repo-Einstellungen aus ist — und das ist die
      # Voreinstellung. Der erste echte Rückfall lief genau dagegen:
      #
      #   GitHub Actions is not permitted to create or approve pull requests
      #
      # Einen Zweig zu schieben darf der Lauf dagegen (`contents: write`).
      # Der Zweig ist die eigentliche Arbeit — den PR daraus zu machen ist ein
      # Klick, und die Zusammenfassung nennt den Link dafür.
      #
      # Konflikte werden hier NICHT aufgelöst: was ein Mensch entscheiden muss,
      # entscheidet kein Lauf um drei Uhr nachts.
      - name: Zweig für den Rückweg vorbereiten
        if: steps.nachziehen.outputs.ergebnis == 'pr'
        id: zweig
        run: |
          set -euo pipefail
          zweig="hotfix-rueckweg/main-nach-develop"
          git checkout -B "$zweig" origin/develop
          if git merge --no-edit origin/main; then
            git push --force-with-lease origin "$zweig"
            echo "zustand=bereit" >> "$GITHUB_OUTPUT"
          else
            git merge --abort || true
            echo "zustand=konflikt" >> "$GITHUB_OUTPUT"
          fi
          echo "zweig=$zweig" >> "$GITHUB_OUTPUT"

      - name: Ergebnis in die Zusammenfassung
        if: always()
        run: |
          set -euo pipefail
          repo="${{ github.server_url }}/${{ github.repository }}"
          zweig="${{ steps.zweig.outputs.zweig }}"
          case "${{ steps.nachziehen.outputs.ergebnis }}" in
            nichts)
              echo "✅ develop enthielt den Hotfix bereits." >> "$GITHUB_STEP_SUMMARY"
              ;;
            vorgespult)
              echo "✅ Hotfix ist in develop — develop wurde auf main vorgespult." >> "$GITHUB_STEP_SUMMARY"
              ;;
            pr)
              case "${{ steps.zweig.outputs.zustand }}" in
                bereit)
                  {
                    echo "### ⚠️ Der Hotfix ist NOCH NICHT in develop"
                    echo
                    echo "Auf develop läuft eigene Arbeit, ein Merge-Commit wäre also nötig — und der ist von keiner CI geprüft. Deshalb wurde er **nicht** nach develop geschoben, sondern auf einem eigenen Zweig vorbereitet:"
                    echo
                    echo "**\`$zweig\`**"
                    echo
                    echo "[→ PR daraus öffnen]($repo/compare/develop...$zweig?expand=1)"
                    echo
                    echo "Solange der PR nicht durch ist, fehlt die Korrektur in develop — und der nächste Release-PR \`develop → main\` kann darüber stolpern."
                  } >> "$GITHUB_STEP_SUMMARY"
                  ;;
                konflikt)
                  {
                    echo "### ❌ Hotfix-Rückweg konfliktbehaftet"
                    echo
                    echo "Der Hotfix und die Arbeit auf develop lassen sich nicht ohne Handarbeit zusammenführen. Ein Lauf löst das nicht auf — das gehört einem Menschen. **Bis dahin fehlt die Korrektur in develop.**"
                    echo
                    echo "\`\`\`"
                    echo "git checkout develop && git merge origin/main"
                    echo "\`\`\`"
                  } >> "$GITHUB_STEP_SUMMARY"
                  ;;
              esac
              ;;
            *)
              echo "❌ Der Hotfix-Rückweg ist nicht durchgelaufen." >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac

      # Sichtbar rot, wenn der Rückweg Handarbeit braucht. Ein grüner Lauf, der
      # develop still zurückfallen lässt, wäre genau der Zustand, gegen den
      # diese Datei geschrieben ist.
      - name: Rot, wenn ein Mensch ran muss
        if: steps.zweig.outputs.zustand == 'konflikt'
        run: exit 1

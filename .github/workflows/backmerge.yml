# A hotfix back into develop — the only way main can get ahead of develop at
# all.
#
# WHAT FOR: the flow is `feature → develop → main`. A hotfix breaks it on
# purpose: it branches off main, is merged into main and never passes through
# develop. Without a way back the correction then stands in production but not
# in development — the next PR `develop → main` would want to overwrite it and
# can run into a conflict over it.
#
# WHY ONLY HOTFIXES: until 08.08.2026 this run listened to EVERY push to main.
# Back then that was right, because Dependabot opened its PRs against the
# default branch and develop fell 21 commits behind because of it. Since
# `dependabot.yml` was deleted, main only gets merges FROM develop — and those
# need no way back, because develop already has the content. What remains is
# exactly the hotfix case, and that is what the trigger aims at now.
#
# WHY ONLY A FAST-FORWARD IS PUSHED DIRECTLY: if develop can be fast-forwarded,
# it is afterwards **byte for byte identical to main** — and main has already
# passed CI. No state comes about that nobody checked.
#
# With a hotfix that is rather the exception: if work runs on develop in
# parallel, the two branches have diverged, and a merge commit is needed. No CI
# has checked that one, so it is NOT pushed to develop but prepared on a branch
# of its own (see below). The fallback is therefore the normal case here, not
# the emergency.
#
# NO LOOP: the push goes to `develop`, the trigger listens to closed PRs into
# `main`. Besides, pushes with the GITHUB_TOKEN trigger no further runs as a
# matter of principle.

name: Hotfix back into develop

on:
  # Not `push` but the closed PR: only that way can one see WHERE the commit
  # came from. A push to main looks the same for a hotfix as for a release from
  # develop.
  pull_request:
    types: [closed]
    branches: [main]
  # Can be triggered by hand — for instance when a hotfix exceptionally landed
  # on main without a PR, or the way back has to be caught up.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Two simultaneous back-merges would overtake each other.
# `cancel-in-progress: false`: the running one may finish — an aborted push
# otherwise leaves exactly the gap this run is meant to close.
concurrency:
  group: backmerge-main-develop
  cancel-in-progress: false

jobs:
  backmerge:
    # Only a REALLY MERGED hotfix PR — a closed PR is not necessarily a merged
    # one, and a release from develop needs no way back.
    #
    # The naming convention `hotfix/…` is therefore load-bearing and not
    # cosmetics: if the branch is called differently, the back-merge does not
    # run, and the correction stays out of develop.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'hotfix/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history: without it the run does not know the common
          # ancestors and cannot tell a fast-forward from a merge.
          fetch-depth: 0

      - name: Set the git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bring develop up to date
        id: catch_up
        run: |
          set -euo pipefail
          git fetch origin main develop

          if git merge-base --is-ancestor origin/main origin/develop; then
            echo "develop already contains main — nothing to do."
            echo "result=nothing" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git checkout -B develop origin/develop
          if git merge --ff-only origin/main; then
            git push origin develop
            echo "develop fast-forwarded to $(git rev-parse --short HEAD)."
            echo "result=fast-forwarded" >> "$GITHUB_OUTPUT"
          else
            echo "No fast-forward possible — develop carries commits of its own."
            echo "result=pr" >> "$GITHUB_OUTPUT"
          fi

      # No fast-forward possible: the merge is prepared on a branch OF ITS OWN,
      # not pushed to develop.
      #
      # Why no `gh pr create`: GitHub forbids Actions to create PRs as long as
      # "Allow GitHub Actions to create and approve pull requests" is off in the
      # repository settings — and that is the default. The first real fallback
      # ran straight into it:
      #
      #   GitHub Actions is not permitted to create or approve pull requests
      #
      # Pushing a branch, on the other hand, the run may do (`contents: write`).
      # The branch is the actual work — making the PR from it is one click, and
      # the summary names the link for it.
      #
      # Conflicts are NOT resolved here: what a person has to decide, no run
      # decides at three in the morning.
      - name: Prepare the branch for the way back
        if: steps.catch_up.outputs.result == 'pr'
        id: branch
        run: |
          set -euo pipefail
          branch="hotfix-backmerge/main-to-develop"
          git checkout -B "$branch" origin/develop
          if git merge --no-edit origin/main; then
            git push --force-with-lease origin "$branch"
            echo "state=ready" >> "$GITHUB_OUTPUT"
          else
            git merge --abort || true
            echo "state=conflict" >> "$GITHUB_OUTPUT"
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Result into the summary
        if: always()
        run: |
          set -euo pipefail
          repo="${{ github.server_url }}/${{ github.repository }}"
          branch="${{ steps.branch.outputs.branch }}"
          case "${{ steps.catch_up.outputs.result }}" in
            nothing)
              echo "✅ develop already contained the hotfix." >> "$GITHUB_STEP_SUMMARY"
              ;;
            fast-forwarded)
              echo "✅ The hotfix is in develop — develop was fast-forwarded to main." >> "$GITHUB_STEP_SUMMARY"
              ;;
            pr)
              case "${{ steps.branch.outputs.state }}" in
                ready)
                  {
                    echo "### ⚠️ The hotfix is NOT YET in develop"
                    echo
                    echo "Work of its own runs on develop, so a merge commit would be needed — and no CI has checked that one. That is why it was **not** pushed to develop but prepared on a branch of its own:"
                    echo
                    echo "**\`$branch\`**"
                    echo
                    echo "[→ Open a PR from it]($repo/compare/develop...$branch?expand=1)"
                    echo
                    echo "As long as the PR is not through, the correction is missing in develop — and the next release PR \`develop → main\` can stumble over it."
                  } >> "$GITHUB_STEP_SUMMARY"
                  ;;
                conflict)
                  {
                    echo "### ❌ The hotfix way back has conflicts"
                    echo
                    echo "The hotfix and the work on develop cannot be merged without manual work. A run does not resolve that — it belongs to a person. **Until then the correction is missing in develop.**"
                    echo
                    echo "\`\`\`"
                    echo "git checkout develop && git merge origin/main"
                    echo "\`\`\`"
                  } >> "$GITHUB_STEP_SUMMARY"
                  ;;
              esac
              ;;
            *)
              echo "❌ The hotfix way back did not run through." >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac

      # Visibly red when the way back needs manual work. A green run that
      # silently lets develop fall behind would be exactly the state this file
      # is written against.
      - name: Red when a person has to step in
        if: steps.branch.outputs.state == 'conflict'
        run: exit 1

# main zurück nach develop — der Rückweg, den der Fluss sonst nicht hat.
#
# WOZU: Dependabot öffnet seine PRs immer gegen den Default-Branch, also gegen
# `main`. Werden sie dort gemergt, hat main Commits, die develop nie sieht —
# und der nächste Feature-Zweig zweigt von einem veralteten develop ab. Genau
# das ist passiert: nach einer Runde Dependabot lag develop 21 Commits zurück,
# ohne dass jemand etwas falsch gemacht hätte.
#
# Der Fluss bleibt `feature → develop → main`. Dieser Lauf ist kein zweiter
# Weg hinein, sondern das Nachziehen danach — wie der Rückweg nach einem
# Hotfix.
#
# WARUM NUR FAST-FORWARD DIREKT GESCHOBEN WIRD: kann develop vorgespult
# werden, ist es hinterher **byteweise identisch mit main** — und main hat die
# CI bereits bestanden. Es entsteht kein Zustand, den niemand geprüft hat.
# Geht das nicht (develop hat eigene Commits), wäre ein Merge-Commit nötig, und
# der ist von nichts geprüft. Dann wird ein PR geöffnet, damit die CI läuft und
# ein Mensch draufschaut, statt still etwas Ungeprüftes nach develop zu heben.
#
# KEINE SCHLEIFE: der Push geht auf `develop`, der Auslöser hört auf `main`.
# Zudem lösen Pushes mit dem GITHUB_TOKEN grundsätzlich keine weiteren Läufe
# aus.

name: Rückführung main → develop

on:
  push:
    branches: [main]
  # Von Hand anstoßbar, damit man den Rückweg auch nachholen kann, ohne auf
  # den nächsten Push nach main zu warten.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Zwei gleichzeitige Rückführungen würden sich gegenseitig überholen.
# `cancel-in-progress: false`: der laufende darf fertig werden — ein
# abgebrochener Push hinterlässt sonst genau die Lücke, die dieser Lauf
# schließen soll.
concurrency:
  group: rueckfuehrung-main-develop
  cancel-in-progress: false

jobs:
  rueckfuehrung:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Die ganze Historie: ohne sie kennt der Lauf die gemeinsamen
          # Vorfahren nicht und kann Fast-Forward nicht von Merge trennen.
          fetch-depth: 0

      - name: Git-Identität setzen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: develop nachziehen
        id: nachziehen
        run: |
          set -euo pipefail
          git fetch origin main develop

          if git merge-base --is-ancestor origin/main origin/develop; then
            echo "develop enthält main bereits — nichts zu tun."
            echo "ergebnis=nichts" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git checkout -B develop origin/develop
          if git merge --ff-only origin/main; then
            git push origin develop
            echo "develop auf $(git rev-parse --short HEAD) vorgespult."
            echo "ergebnis=vorgespult" >> "$GITHUB_OUTPUT"
          else
            echo "Kein Fast-Forward möglich — develop trägt eigene Commits."
            echo "ergebnis=pr" >> "$GITHUB_OUTPUT"
          fi

      # Kein Fast-Forward möglich: der Merge wird auf einem EIGENEN Zweig
      # vorbereitet, nicht nach develop geschoben.
      #
      # Warum kein `gh pr create`: GitHub verbietet Actions das Anlegen von
      # PRs, solange „Allow GitHub Actions to create and approve pull
      # requests" in den Repo-Einstellungen aus ist — und das ist die
      # Voreinstellung. Der erste echte Rückfall lief genau dagegen:
      #
      #   GitHub Actions is not permitted to create or approve pull requests
      #
      # Einen Zweig zu schieben darf der Lauf dagegen (`contents: write`).
      # Der Zweig ist die eigentliche Arbeit — den PR daraus zu machen ist ein
      # Klick, und die Zusammenfassung nennt den Link dafür.
      #
      # Konflikte werden hier NICHT aufgelöst: was ein Mensch entscheiden muss,
      # entscheidet kein Lauf um drei Uhr nachts.
      - name: Zweig für den Rückweg vorbereiten
        if: steps.nachziehen.outputs.ergebnis == 'pr'
        id: zweig
        run: |
          set -euo pipefail
          zweig="rueckfuehrung/main-nach-develop"
          git checkout -B "$zweig" origin/develop
          if git merge --no-edit origin/main; then
            git push --force-with-lease origin "$zweig"
            echo "zustand=bereit" >> "$GITHUB_OUTPUT"
          else
            git merge --abort || true
            echo "zustand=konflikt" >> "$GITHUB_OUTPUT"
          fi
          echo "zweig=$zweig" >> "$GITHUB_OUTPUT"

      - name: Ergebnis in die Zusammenfassung
        if: always()
        run: |
          set -euo pipefail
          repo="${{ github.server_url }}/${{ github.repository }}"
          zweig="${{ steps.zweig.outputs.zweig }}"
          case "${{ steps.nachziehen.outputs.ergebnis }}" in
            nichts)
              echo "✅ develop war bereits auf Stand." >> "$GITHUB_STEP_SUMMARY"
              ;;
            vorgespult)
              echo "✅ develop wurde auf main vorgespult." >> "$GITHUB_STEP_SUMMARY"
              ;;
            pr)
              case "${{ steps.zweig.outputs.zustand }}" in
                bereit)
                  {
                    echo "### ⚠️ develop konnte nicht vorgespult werden"
                    echo
                    echo "develop trägt eigene Commits, ein Merge-Commit wäre also nötig — und der ist von keiner CI geprüft. Deshalb wurde er **nicht** nach develop geschoben, sondern auf einem eigenen Zweig vorbereitet:"
                    echo
                    echo "**\`$zweig\`**"
                    echo
                    echo "[→ PR daraus öffnen]($repo/compare/develop...$zweig?expand=1)"
                    echo
                    echo "Dann läuft die CI darüber, und ein Mensch sieht ihn."
                  } >> "$GITHUB_STEP_SUMMARY"
                  ;;
                konflikt)
                  {
                    echo "### ❌ Rückweg konfliktbehaftet"
                    echo
                    echo "main und develop lassen sich nicht ohne Handarbeit zusammenführen. Ein Lauf löst das nicht auf — das gehört einem Menschen."
                    echo
                    echo "\`\`\`"
                    echo "git checkout develop && git merge origin/main"
                    echo "\`\`\`"
                  } >> "$GITHUB_STEP_SUMMARY"
                  ;;
              esac
              ;;
            *)
              echo "❌ Die Rückführung ist nicht durchgelaufen." >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac

      # Sichtbar rot, wenn der Rückweg Handarbeit braucht. Ein grüner Lauf, der
      # develop still zurückfallen lässt, wäre genau der Zustand, gegen den
      # diese Datei geschrieben ist.
      - name: Rot, wenn ein Mensch ran muss
        if: steps.zweig.outputs.zustand == 'konflikt'
        run: exit 1

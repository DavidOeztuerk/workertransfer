name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-packages --all-groups --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy packages apps
      # Testcontainers (identity-service integration suite) needs a reachable
      # Docker daemon. ubuntu-latest has Docker, so the integration tests run
      # here; on Docker-less runners they self-skip (ADR-0011 offline-skip).
      - run: uv run pytest

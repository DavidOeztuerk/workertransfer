name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

# A second trigger on the same branch makes the first one worthless — and the
# image job is the most expensive one here.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# READ ONLY, and `packages` has not been part of it since 10.09.2026.
#
# Girder came from GitHub Packages until then and demanded a sign-in; this is
# why `packages: read` stood here, and a NuGet sign-in at FOUR places in the run
# — two of them wrote a whole NuGet.Config into a file. Since Girder lives on
# nuget.org, the run needs none of that, and what a run does not need it does
# not get.
#
# `contents: read` is spelled out, because a block REPLACES the default instead
# of adding to it: an empty block would take checkout away from the run.
permissions:
  contents: read

env:
  # One number for all three places: `docker/web.Dockerfile`,
  # `docker/web-prod.Dockerfile` and the two Node jobs. Exactly this lockstep was
  # missing when a jump to node 25 got through CI and broke the image: node 25
  # no longer ships corepack, and no job here ever built an image.
  NODE_MAJOR: "25"

jobs:
  # --------------------------------------------------------------------------
  backend-quality:
    name: .NET — build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"


      - run: dotnet restore WorkerTransfer.slnx

      # Warnings are errors (Directory.Build.props) — the build IS the gate.
      - name: Build
        run: dotnet build WorkerTransfer.slnx --no-restore

      # BUILD AND TEST IN SEPARATE STEPS, and the suites ONE AT A TIME.
      # `dotnet test` over the solution starts fifteen Postgres containers at
      # once; Testcontainers' ResourceReaper then runs into a timeout and ALL
      # suites fall within a millisecond with TypeInitializationException. That
      # looks like a broken build and is none.
      #
      # ubuntu-latest has a Docker daemon, so the integration suites really run
      # here. The script goes red when a suite executed nothing at all — a suite
      # that silently skips itself otherwise looks exactly like a passed one.
      - name: Test
        run: ./scripts/test-dotnet.sh

  # --------------------------------------------------------------------------
  frontend-quality:
    name: UI — check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # THE VERSION STANDS IN `web/package.json`, and only there.
      #
      # By default the action looks for `packageManager` in the ROOT — the
      # `package.json` there has not existed since the workspace was merged
      # (CLAUDE.md: `web/` carries its own lockfile). Without this pointer it
      # aborts after five seconds with "No pnpm version is specified".
      #
      # The pointer and no `version:` line: a second number here would be the
      # one that stays behind at the next jump.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_MAJOR }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm check
        working-directory: web
      - run: pnpm test
        working-directory: web

      # `pnpm build` belongs here and is not just cosmetics: tsc and Vitest both
      # do not run through the build path, and an error that only shows up when
      # bundling otherwise shows up only in the image.
      - run: pnpm build
        working-directory: web

  # --------------------------------------------------------------------------
  # THE SECOND GAP: the journeys ran automatically nowhere.
  #
  # Playwright used to stand only behind `make validate-e2e`, that is behind a
  # person's decision — and the journeys are the only thing that really touches
  # the wire between UI and services. Exactly there sat a whole class of
  # defects: fields in camelCase that the service expects in snake_case never
  # arrived, and EVERY suite stayed green, because none of them runs across
  # both sides.
  #
  # A job of its own and not a step in the image job: otherwise a red journey
  # hides the image build (and the other way round), and the two take very
  # different times. The images come from the same cache, so building costs
  # little here.
  e2e:
    name: Journeys — through the whole stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3


      - name: Build the service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dotnet-service.Dockerfile
          load: true
          tags: workertransfer-dotnet:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create the environment
        run: |
          make env

          # SET UP THE GITHUB SIGN-IN — WITH INVENTED VALUES, AND THAT IS SAFE.
          #
          # `.env.example` leaves the three empty, and that is right there: empty
          # means "not set up", then the gist stays and the "Sign in with
          # GitHub" button does not appear at all. Exactly on that fell two
          # checks written against a stack where it IS set up: `consents-journey`
          # expects the button, and the route map expects a 422 on
          # `/github/me/oauth/finish` — which exists only BECAUSE `start` created
          # a row. Without the setup `start` creates nothing and `finish`
          # answers 404. Both answers are right; they differ by configuration.
          #
          # The values may be invented, because nothing goes out with them:
          # `start` assembles the address in-process, and in `finish` the state
          # comparison stands BEFORE the code exchange — a request with a
          # foreign `state` falls to 422 without ever asking github.com. The
          # journey only looks at the button; it does not click it.
          {
            echo "WORKERTRANSFER_GITHUB_OAUTH_ID=ci-invented"
            echo "WORKERTRANSFER_GITHUB_OAUTH_SECRET=ci-invented"
          } >> .env

      # Here `web` comes along — unlike in the image job. The journeys load the
      # UI on :5173 and call the gateway on :8090 from there.
      - name: The stack comes up
        run: |
          docker compose up -d --wait --wait-timeout 480
          docker compose ps

      # The pointer to `web/package.json` — reason at `frontend-quality`.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_MAJOR }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: web

      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web

      # Without a running stack the journeys skip THEMSELVES, and a skipped test
      # looks like a passed one. So the number is read: zero journeys run is a
      # failure here, not a green run.
      - name: The journeys
        working-directory: web
        run: |
          set -o pipefail
          pnpm e2e --reporter=line 2>&1 | tee journeys.log
          ran=$(grep -oE '[0-9]+ passed' journeys.log | tail -1 | grep -oE '[0-9]+' || echo 0)
          echo "Journeys green: ${ran}"
          [ "${ran:-0}" -ge 15 ] || {
            echo "::error::Only ${ran} journeys ran — the stack was probably not up."; exit 1; }

      - name: What the journeys saw when something was red
        if: failure()
        run: |
          docker compose logs --tail 80
          ls -R web/test-results 2>/dev/null | head -40

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: journey-traces
          path: web/test-results
          retention-days: 7

      - name: Tear the stack down
        if: always()
        run: docker compose down -v

  # --------------------------------------------------------------------------
  # THE JOB THAT DID NOT EXIST BEFORE.
  #
  # Up to here CI never built a container. A green CI that builds no image says
  # nothing about what is shipped — that is exactly how the jump to node 25 got
  # through and broke the UI image. This job catches that class.
  images:
    name: Images — build them and really bring the stack up
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3


      # ONE image for all services and the gateway (ADR-0028). Without a
      # `build-arg`: they differ only in SERVICE_DIR, and the container sets
      # that, not the build.
      #
      # The tag is the one docker-compose.yml expects — that is why compose
      # further down builds nothing again but takes exactly this image.
      - name: Build the service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dotnet-service.Dockerfile
          load: true
          tags: workertransfer-dotnet:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The shipped UI image — not the Vite development server from
      # `docker/web.Dockerfile`, but what goes into the cluster.
      - name: Build the UI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web-prod.Dockerfile
          load: true
          tags: workertransfer/web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Without .env nothing comes up, and that is on purpose: no secret has a
      # built-in default any more. `make env` creates it and rolls the three
      # fresh — different per run, which is exactly right here.
      - name: Create the environment
        run: |
          make env

          # SET UP THE GITHUB SIGN-IN — WITH INVENTED VALUES, AND THAT IS SAFE.
          #
          # `.env.example` leaves the three empty, and that is right there: empty
          # means "not set up", then the gist stays and the "Sign in with
          # GitHub" button does not appear at all. Exactly on that fell two
          # checks written against a stack where it IS set up: `consents-journey`
          # expects the button, and the route map expects a 422 on
          # `/github/me/oauth/finish` — which exists only BECAUSE `start` created
          # a row. Without the setup `start` creates nothing and `finish`
          # answers 404. Both answers are right; they differ by configuration.
          #
          # The values may be invented, because nothing goes out with them:
          # `start` assembles the address in-process, and in `finish` the state
          # comparison stands BEFORE the code exchange — a request with a
          # foreign `state` falls to 422 without ever asking github.com. The
          # journey only looks at the button; it does not click it.
          {
            echo "WORKERTRANSFER_GITHUB_OAUTH_ID=ci-invented"
            echo "WORKERTRANSFER_GITHUB_OAUTH_SECRET=ci-invented"
          } >> .env

      # THE ACTUAL PROOF.
      #
      # Not "the container was still running after three seconds" — that is
      # measured and worthless: a service that falls over its configuration at
      # start burns on a core for minutes afterwards, and `Running` says `true`
      # all that time. So what is asked is what counts: `--wait` waits for the
      # health probe of EVERY container, and that calls /health/live inside the
      # container itself.
      #
      # `web` stays out: that is the Vite development server, not the shipped
      # image. The list comes from compose, so a new service comes along
      # automatically instead of being forgotten here.
      - name: The stack comes up
        run: |
          docker compose up -d --wait --wait-timeout 420 \
            $(docker compose config --services | grep -v '^web$')
          docker compose ps

      # Reading through the gateway. /jobs belongs to jobs-service — so it
      # really is routed and not merely answered by something.
      #
      # 200 is expected: a job list is public, because the career page goes
      # through exactly this endpoint. The proof of routing is, as before, the
      # ANSWER and not its success — only jobs-service can have written the page
      # shape. A missing route would be an empty 404 from Ocelot, a dead service
      # a 502, and the UI would send HTML.
      #
      # `items` AND `total_pages` are checked. `items` alone is not enough any
      # more since the list pages: `total_pages` is the field on which a fall
      # back to the old cursor shape would stand out, and it stands out nowhere
      # else — the UI would then silently show one page.
      - name: Reading through the gateway
        run: |
          code=$(curl -s -o answer.json -w '%{http_code}' http://localhost:8090/jobs)
          echo "GET /jobs -> ${code}"
          [ "$code" = "200" ] || { echo "::error::/jobs delivered ${code}, expected 200."; cat answer.json; exit 1; }
          grep -q '"items"' answer.json || {
            echo "::error::/jobs was not answered by jobs-service:"; cat answer.json; exit 1; }
          grep -q '"total_pages"' answer.json || {
            echo "::error::/jobs answers without the page shape (fall back to the cursor?):"
            cat answer.json; exit 1; }

      # And the error shape, at a service no other step here touches. The step
      # above used to prove it on the way past; since /jobs is public, nobody
      # proves it any more. A 401 without a problem document would be Ocelot's
      # own refusal — then authentication would run in the gateway instead of
      # in the service, and that stands out nowhere else.
      - name: The error shape comes from a service
        run: |
          code=$(curl -s -o refused.json -w '%{http_code}' http://localhost:8090/consent/me)
          echo "GET /consent/me -> ${code}"
          [ "$code" = "401" ] || { echo "::error::/consent/me delivered ${code}, expected 401."; cat refused.json; exit 1; }
          grep -q '"correlationId"' refused.json || {
            echo "::error::no RFC 9457 document with correlationId:"; cat refused.json; exit 1; }

      # And writing. ONLY that proves the migrations really ran: the read path
      # above answers even when not a single table exists.
      - name: Writing, across identity
        run: |
          address="ci-proof-${GITHUB_RUN_ID}@example.org"
          status=$(curl -s -o answer.json -w '%{http_code}' \
            -X POST http://localhost:8090/auth/register \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"${address}\",\"password\":\"a-sufficiently-long-password\",\"display_name\":\"CI proof\"}")
          echo "POST /auth/register -> ${status}"
          [ "$status" = "201" ] || { echo "::error::Registration delivered ${status}."; cat answer.json; exit 1; }

      # The whole route map: every endpoint, every capacity.
      #
      # It stands here and not in the test suite, because it needs the running
      # stack — and a suite that skips itself without one looks like a passed
      # one. Here the stack is running anyway.
      - name: The route map still holds
        run: ./scripts/route-map.sh

      # With a red step the logs are the only thing that helps — the stack is
      # gone one line later.
      - name: Logs, when something was red
        if: failure()
        run: docker compose logs --tail 60

      - name: Tear the stack down
        if: always()
        run: docker compose down -v

      # The UI image separately: nginx needs none of all that. It has to serve
      # its index.html AND config.js beside it — `vite build` bakes VITE_* into
      # the bundle, that is why web/src/env.ts resolves at runtime via
      # window.__WT_CONFIG__. If the file is missing, that only shows up in the
      # cluster.
      - name: The UI serves
        run: |
          cid=$(docker run -d -p 8099:80 workertransfer/web:ci)
          for _ in $(seq 1 30); do
            sleep 1
            curl -sf http://localhost:8099/ -o index.html 2>/dev/null && break
          done
          grep -q '<div id="root">' index.html || {
            echo "::error::The UI image serves no index.html."
            docker logs "$cid" 2>&1 | tail -20; exit 1; }
          curl -sf http://localhost:8099/config.js -o config.js || {
            echo "::error::/config.js is missing — the runtime resolution would have nothing to read."
            exit 1; }
          docker rm -f "$cid" >/dev/null
          echo "  index.html and config.js arrive."

      - uses: azure/setup-helm@v4

      # The chart is not rolled out but rendered. `make k8s-lint` is the local
      # twin of this step — the same line, no second place.
      - name: The chart renders
        run: make k8s-lint

  # --------------------------------------------------------------------------
  # Known vulnerabilities in dependencies.
  #
  # It does NOT run with `continue-on-error`. A scan that may be red gets
  # ignored after the second week — and is then worse than none, because it
  # creates the feeling that somebody is looking.
  #
  # There is no `dependabot.yml` (deleted on 08.08.2026, its uv run never
  # finished). This job is therefore the only place that asks at all.
  dependency-audit:
    name: Dependencies — known vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"


      - run: dotnet restore WorkerTransfer.slnx

      - name: Check the .NET packages
        env:
          # The output is READ, so its language has to be fixed. Locally the
          # same command answers in German ("Fuer das angegebene Projekt ...
          # liegen keine anfaelligen Pakete vor"), on the runner in English — a
          # grep for one of the two sentences would be silently always true in
          # the other environment.
          DOTNET_CLI_UI_LANGUAGE: en
        # `--include-transitive`: most findings are not in what we declare
        # ourselves but one level below.
        #
        # Two checks, and the second is the more important one:
        #
        # 1. `dotnet list package --vulnerable` DOES NOT FAIL when it finds
        #    something — it only writes it down. Without this evaluation the
        #    step would be a green tick over a list of findings.
        # 2. The output must have named projects at all. Exactly this thought
        #    already stood in the old CI ("aborts when the export delivers
        #    fewer than 50 entries"): a scan that for some reason examined
        #    nothing is otherwise indistinguishable from a clean result.
        #
        # The SENTENCE is searched for, not the severity words: the table column
        # is called differently depending on the version, the sentence "has the
        # following vulnerable packages" is the statement itself.
        run: |
          set -o pipefail
          dotnet list WorkerTransfer.slnx package --vulnerable --include-transitive \
            | tee findings.txt

          projects=$(grep -c "The given project" findings.txt || true)
          if [ "$projects" -lt 50 ]; then
            echo "::error::The scan names only ${projects} projects — it examined nothing."
            exit 1
          fi
          echo "Examined: ${projects} projects."

          if grep -q "has the following vulnerable packages" findings.txt; then
            echo "::error::Vulnerable packages found — see the list above."
            exit 1
          fi

      # The pointer to `web/package.json` — reason at `frontend-quality`.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_MAJOR }}

      # HERE stood a copy of the frontend sequence (install, check, test,
      # build) — that is exactly what `frontend-quality` does anyway, and NO
      # check.
      #
      # It is a leftover of the de-duplication: the file defined
      # `dependency-audit` twice, and the two versions were not the same. One
      # had DOTNET_CLI_UI_LANGUAGE, the other this step. When resolving it the
      # first one stayed — and with that the pnpm part of the job dropped out
      # silently, while CLAUDE.md went on describing it as its half. An audit
      # nobody runs is worse than none: it stands in the document and reassures.
      - name: Check the frontend packages
        # `--prod`: what only runs while building reaches no browser.
        # `moderate` as the threshold, so "low" does not block every week.
        run: pnpm audit --prod --audit-level moderate
        working-directory: web

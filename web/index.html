<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="WorkerTransfer – consent-first talent mobility and career workflows."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>WorkerTransfer</title>
    <!--
      Runtime configuration. Deliberately NOT type="module": a classic script
      runs at once and therefore certainly before the bundle below, which as a
      module is deferred anyway. src/env.ts reads the values on import, and
      that import must not come first.

      It is not bundled (it lives in public/), so it stays a file of its own —
      and exactly that lets the Helm chart replace it in the container instead
      of building a new image for every environment.
    -->
    <script src="/config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

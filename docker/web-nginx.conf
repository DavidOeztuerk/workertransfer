# Auslieferung der gebauten Oberfläche.
#
# Im Image und nicht im Chart, weil hier nichts umgebungsabhängig ist: der
# SPA-Rückfall und die Zwischenspeicher-Regeln gelten überall gleich.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Ohne diese Zeile antwortet ein NEULADEN von /profile oder /markt mit 404:
    # der TanStack Router kennt diese Pfade, nginx nicht — auf der Platte liegt
    # nur index.html. Der erste Aufruf über einen Link funktioniert, das
    # Neuladen nicht, und genau diese Hälfte fällt beim Testen zuerst durch.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Die Laufzeitkonfiguration wird vom Chart im Betrieb ersetzt. Würde sie
    # zwischengespeichert, zeigte der Browser nach einem Umzug der Umgebung
    # weiter auf die alten Adressen — und niemand käme darauf, warum.
    location = /config.js {
        add_header Cache-Control "no-store" always;
    }

    # index.html ebenso: sie verweist auf die Bündel mit ihrem Hash im Namen.
    # Eine alte index.html im Zwischenspeicher fordert Bündel an, die es nach
    # dem nächsten Deploy nicht mehr gibt — die Seite bleibt dann weiss.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # Die Bündel tragen ihren Hash im Namen und können deshalb ewig liegen
    # bleiben: ändert sich der Inhalt, ändert sich der Name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Kein Zugriffsprotokoll mit Pfaden auf einer Seite, die Slugs von Personen
    # und Unternehmen in der Adresse trägt (docs/product-scope.md). Fehler
    # werden weiter protokolliert.
    access_log off;
}

[project]
name = "worker-auth"
version = "0.1.0"
description = "Authentication: JWT, OAuth2, OIDC, API Keys, Refresh tokens, Session management"
requires-python = ">=3.14"
dependencies = [
    "pyjwt>=2.8.0,<3.0.0",
    # JwtAuthMiddleware is raw ASGI and imports starlette.types.
    "starlette>=0.37.0,<1.0.0",
    "bcrypt>=4.0.0,<5.0.0",
    "pydantic>=2.8.0,<3.0.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "worker_auth"

[tool.uv.sources]
worker-core = { workspace = true }
worker-shared = { workspace = true }
worker-config = { workspace = true }
worker-correlation = { workspace = true }
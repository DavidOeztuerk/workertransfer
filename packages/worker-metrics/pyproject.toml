[project]
name = "worker-metrics"
version = "0.1.0"
description = "Prometheus metrics: Custom metrics, Histograms, Counters, Gauges"
requires-python = ">=3.14"
dependencies = [
    "prometheus-client>=0.19.0,<1.0.0",
    "starlette>=0.37.0,<1.0.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "worker_metrics"

[tool.uv.sources]
worker-core = { workspace = true }
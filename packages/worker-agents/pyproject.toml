[project]
name = "worker-agents"
version = "0.1.0"
description = "Agent Runtime: Planner, Executor, Evaluator, Reflection, Knowledge, Vector search"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.8.0,<3.0.0",
    "langchain-core>=0.2.0,<1.0.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "worker_agents"

[tool.uv.sources]
worker-core = { workspace = true }
worker-ai = { workspace = true }
worker-mcp = { workspace = true }
worker-search = { workspace = true }
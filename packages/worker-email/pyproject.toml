[project]
name = "worker-email"
version = "0.1.0"
description = "Email: SMTP, SES, SendGrid, Templates, Queue, Tracking"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.9.0,<4.0.0",
    "sendgrid>=6.10.0,<7.0.0",
    "boto3>=1.34.0,<2.0.0",
    "pydantic>=2.8.0,<3.0.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "worker_email"

[tool.uv.sources]
worker-core = { workspace = true }
worker-config = { workspace = true }
worker-templates = { workspace = true }
[project]
name = "worker-cli"
version = "0.1.0"
description = "WorkerTransfer CLI for code generation and service management"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.12.0,<1.0.0",
    "rich>=13.7.0,<14.0.0",
    "jinja2>=3.1.0,<4.0.0",
]

[project.scripts]
worker = "worker_cli.main:app"

[build-system]
requires = ["uv_build>=0.11,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "worker_cli"

[tool.uv.sources]
worker-core = { workspace = true }
worker-shared = { workspace = true }
[project]
name = "worker-health"
version = "0.1.0"
description = "Health checks: Liveness, Readiness, Startup, Dependency checks"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.110.0,<1.0.0",
    "pydantic>=2.8.0,<3.0.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "worker_health"

[tool.uv.sources]
worker-core = { workspace = true }
worker-database = { workspace = true }
worker-cache = { workspace = true }

[project]
name = "worker-middleware"
version = "0.1.0"
description = "HTTP Middleware: Auth, AuthZ, Rate limit, Request/Response logging, Correlation, Tenant, Security, Compression, Exception handling, Metrics, Tracing, Localization"
requires-python = ">=3.14"
dependencies = [
    "starlette>=0.37.0,<1.0.0",
    "fastapi>=0.110.0,<1.0.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "worker_middleware"

[tool.uv.sources]
worker-core = { workspace = true }
worker-auth = { workspace = true }
worker-authorization = { workspace = true }
worker-ratelimit = { workspace = true }
worker-correlation = { workspace = true }
worker-tenancy = { workspace = true }
worker-security = { workspace = true }
worker-metrics = { workspace = true }
worker-tracing = { workspace = true }
worker-resilience = { workspace = true }
[project]
name = "worker-search"
version = "0.1.0"
description = "Search: Elasticsearch, Meilisearch, Vector search"
requires-python = ">=3.14"
dependencies = [
    "elasticsearch>=8.15.0,<9.0.0",
    "meilisearch>=0.30.0,<1.0.0",
    "qdrant-client>=1.9.0,<2.0.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "worker_search"

[tool.uv.sources]
worker-core = { workspace = true }
worker-config = { workspace = true }
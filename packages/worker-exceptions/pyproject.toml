[project]
name = "worker-exceptions"
version = "0.1.0"
description = "RFC 9457 ProblemDetails, exception mapping, and error codes"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.8.0,<3.0.0",
    "fastapi>=0.110.0,<1.0.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "worker_exceptions"

[tool.uv.sources]
worker-core = { workspace = true }
worker-validation = { workspace = true }
[project]
name = "worker-resilience"
version = "0.1.0"
description = "Resilience patterns: Retry, Circuit Breaker, Timeout, Bulkhead, Fallback"
requires-python = ">=3.14"
dependencies = [
    "tenacity>=8.2.0,<9.0.0",
    "pydantic>=2.8.0,<3.0.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "worker_resilience"

[tool.uv.sources]
worker-core = { workspace = true }
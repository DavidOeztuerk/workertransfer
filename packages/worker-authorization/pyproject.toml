[project]
name = "worker-authorization"
version = "0.1.0"
description = "Authorization: RBAC, ABAC, Casbin, Permission decorators, Policy evaluation"
requires-python = ">=3.14"
dependencies = [
    "casbin>=1.43.0,<2.0.0",
    "casbin-sqlalchemy-adapter>=1.4.0,<2.0.0",
    "pydantic>=2.8.0,<3.0.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "worker_authorization"

[tool.uv.sources]
worker-core = { workspace = true }
worker-shared = { workspace = true }
worker-config = { workspace = true }
worker-auth = { workspace = true }
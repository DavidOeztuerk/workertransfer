[project]
name = "worker-messaging"
version = "0.1.0"
description = "Message bus: RabbitMQ, Kafka, NATS, Serialization, Routing, Consumers, Publishers, Retry, DLQ"
requires-python = ">=3.14"
dependencies = [
    "aio-pika>=9.4.0,<10.0.0",
    "aiokafka>=0.9.0,<1.0.0",
    "nats-py>=2.8.0,<3.0.0",
    "pydantic>=2.8.0,<3.0.0",
    "msgspec>=0.18.0,<1.0.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "worker_messaging"

[tool.uv.sources]
worker-core = { workspace = true }
worker-shared = { workspace = true }
worker-config = { workspace = true }
worker-events = { workspace = true }
worker-correlation = { workspace = true }
worker-resilience = { workspace = true }
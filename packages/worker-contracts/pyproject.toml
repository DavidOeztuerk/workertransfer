[project]
name = "worker-contracts"
version = "0.1.0"
description = "API Contracts: Shared DTOs, Events, Messages, Versioning"
requires-python = ">=3.14"
dependencies = [
    "worker-core",
    "pydantic>=2.8.0,<3.0.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "worker_contracts"

[tool.uv.sources]
worker-core = { workspace = true }
worker-shared = { workspace = true }

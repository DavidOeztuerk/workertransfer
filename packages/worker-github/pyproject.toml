[project]
name = "worker-github"
version = "0.1.0"
description = "GitHub Intelligence: OAuth, Repository Scanner, Skill Analyzer, OSS Reputation, Contribution Analyzer"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.27.0,<1.0.0",
    "githubkit>=0.16.0,<1.0.0",
    "pydantic>=2.8.0,<3.0.0",
    "redis>=5.0.0,<6.0.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "worker_github"

[tool.uv.sources]
worker-core = { workspace = true }
worker-config = { workspace = true }
worker-cache = { workspace = true }
worker-ai = { workspace = true }
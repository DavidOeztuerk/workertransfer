[project]
name = "worker-shared"
version = "0.1.0"
description = "Shared utilities: constants, enums, time, IDs, pagination, money, address, phone, email"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.8.0,<3.0.0",
    "python-dateutil>=2.9.0,<3.0.0",
    "phonenumbers>=8.13.0,<9.0.0",
    "email-validator>=2.1.0,<3.0.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "worker_shared"

[tool.uv.sources]
worker-core = { workspace = true }
[project]
name = "worker-validation"
version = "0.1.0"
description = "Validation: FluentValidation style, Request/Domain/Business validators"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.8.0,<3.0.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "worker_validation"

[tool.uv.sources]
worker-core = { workspace = true }
[project]
name = "worker-scheduler"
version = "0.1.0"
description = "Job scheduling: Cron, Recurring, Delayed, Distributed scheduler"
requires-python = ">=3.14"
dependencies = [
    "apscheduler>=3.10.0,<4.0.0",
    "redis>=5.0.0,<6.0.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "worker_scheduler"

[tool.uv.sources]
worker-core = { workspace = true }
worker-cache = { workspace = true }
worker-messaging = { workspace = true }
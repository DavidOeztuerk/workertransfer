[project]
name = "worker-platform"
version = "0.1.0"
description = "Cross-cutting application platform for WorkerTransfer services"
requires-python = ">=3.14"
dependencies = [
    # Für Traces. Der Import in `app.py` steht INNEN und läuft nur, wenn ein
    # OTLP-Endpunkt eingerichtet ist — ohne ihn wird das SDK nie geladen.
    "worker-tracing",
  "fastapi>=0.128.0,<1.0.0",
  "pydantic-settings>=2.12.0,<3.0.0",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

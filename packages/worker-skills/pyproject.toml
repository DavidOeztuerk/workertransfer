[project]
name = "worker-skills"
version = "0.1.0"
description = "Skill vocabulary: canonical names and their aliases — renaming only, never inference"
requires-python = ">=3.14"
# Keine Abhängigkeit. Ein Vokabular ist eine Tabelle und eine Funktion; alles,
# was hier hinzukäme, wäre ein Hinweis darauf, dass es mehr tut, als es darf.
dependencies = []

[build-system]
requires = ["uv_build>=0.11,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "worker_skills"

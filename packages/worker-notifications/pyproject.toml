[project]
name = "worker-notifications"
version = "0.1.0"
description = "Notifications: Email, SMS, Push, WebSocket, Templates, Queue"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.8.0,<3.0.0",
    "redis>=5.0.0,<6.0.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "worker_notifications"

[tool.uv.sources]
worker-core = { workspace = true }
worker-config = { workspace = true }
worker-cache = { workspace = true }
worker-email = { workspace = true }
[project]
name = "worker-ratelimit"
version = "0.1.0"
description = "Rate limiting: Token bucket, Sliding window, Distributed (Redis)"
requires-python = ">=3.14"
dependencies = [
    "redis>=5.0.0,<6.0.0",
    "pydantic>=2.8.0,<3.0.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "worker_ratelimit"

[tool.uv.sources]
worker-core = { workspace = true }
worker-cache = { workspace = true }
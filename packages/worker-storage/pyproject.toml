[project]
name = "worker-storage"
version = "0.1.0"
description = "Storage abstraction: S3, MinIO, Azure Blob, Local, Signed URLs"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.34.0,<2.0.0",
    "minio>=7.2.0,<8.0.0",
    "azure-storage-blob>=12.23.0,<13.0.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "worker_storage"

[tool.uv.sources]
worker-core = { workspace = true }
worker-config = { workspace = true }
[project]
name = "worker-config"
version = "0.1.0"
description = "Configuration management with environment loading, secrets, feature flags, and validation"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.8.0,<3.0.0",
    "pydantic-settings>=2.4.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "worker-platform",
]

[build-system]
requires = ["uv_build>=0.11,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "worker_config"

[tool.uv.sources]
worker-platform = { workspace = true }
[project]
name = "worker-ai"
version = "0.1.0"
description = "AI seam: one text-drafting port, one provider, nothing stored"
requires-python = ">=3.14"
# EINE Abhängigkeit. Die frühere Fassung deklarierte acht (openai, anthropic,
# google-generativeai, ollama, pydantic-ai, chromadb, sentence-transformers,
# pydantic) für 246 Zeilen ohne einen einzigen Konsumenten — und war genau
# deshalb unbaubar unter Python 3.14 und aus dem Workspace ausgeschlossen.
# Siehe ADR-0024, und davor ADR-0021 für denselben Fehler bei worker-files.
#
# `httpx` statt des Anbieter-SDK: der Aufruf ist ein POST mit JSON. Ein SDK
# brächte einen eigenen Auth-, Retry- und Typ-Apparat mit, von dem hier nichts
# gebraucht wird — und httpx steht ohnehin in jedem Dienst.
dependencies = [
    "httpx>=0.27.0,<1.0.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "worker_ai"
